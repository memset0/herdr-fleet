[[invasive]]
id = "pane-surface-route-port"
intent = "Let a Pane be drawn as its mirror or as the terminal it mirrors, by pointing one route's element and loader at fork-owned drop-ins."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.8.2"
paths = ["web/src/router.tsx#FleetPaneRoute"]
verify = [
  "fleet/ui/terminal/switch.test.ts",
  "fleet/ui/terminal/font.test.ts",
  "fleet/ui/terminal/link.test.ts",
  "fleet/ui/terminal/pool.test.ts",
  "fleet/ui/terminal/clipboard.test.ts",
  "web/src/components/fleet-pane-route.test.tsx",
  "web/src/components/fleet-pane-surface-toggle.test.tsx",
  "web/src/components/fleet-terminal.test.tsx"
]
reason = "The router names fork-owned surface and loader drop-ins while preserving its native route id. With the switch at its default the existing Pane loader runs; the terminal branch returns no mirror text, so polling does not read hidden output. Both surfaces now render the native DetailRoute frame through its separate body port, rather than replacing the whole frame and losing its header controls. Surface selection, terminal lifetime, geometry and clipboard behavior stay fork-owned, and the root connection banner continues to read the same no-mirror data shape."

[[invasive]]
id = "native-pane-content-port"
intent = "Forward an optional Pane body while retaining the native route metadata, identity and AppBar owner."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.8.2"
paths = ["web/src/routes/detail.tsx#renderContent"]
verify = ["web/src/components/fleet-pane-route.test.tsx", "web/src/routes/detail.test.tsx"]
reason = "The native route already owns scoped Pane lookup, fresh-Pane fallback, closed-Pane recovery and navigation. Forwarding one optional typed content renderer into AgentChat preserves all of them and keeps the same frame mounted across surface changes. Reimplementing that frame in a terminal-only route duplicated its header and omitted identity/actions; this port is narrower than extracting or copying the header. AgentChat itself is already attributed to native-manual-pane-fit-port, whose rationale covers the matching body slot."

[[invasive]]
id = "authenticated-navigation-cache"
intent = "Require a fresh Gateway decision before every document navigation."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.8.2"
paths = [
  "web/src/sw.ts#Authenticated app-shell boundary",
  "web/e2e/service-worker.spec.ts#network-first navigation by design"
]
verify = ["fleet/sw-boundary.test.ts", "web/src/lib/sw-routes.test.ts", "web/e2e/service-worker.spec.ts"]
reason = "The upstream service worker owns the app-shell navigation order and is the only place an authenticated document cache can be bypassed. Reviewed against Collie 1.8.2 and kept: upstream still answers every navigation outside its NAVIGATION_NETWORK_ONLY denylist (API, `/auth`, proxy namespaces, `/crew/v1`, the one-release `/pack/v1`, `/standby`) from the precached app shell, so an expired session could still recover a cached authenticated shell. The fork's network-first route supersedes that whole denylist, including its REMOVE_IN_1_9_0 version 1 line, so nothing here changes when upstream drops it. Collie 1.8's browser tier brought two cases this route contradicts by design, both resting on the old worker answering a navigation from its precache. The stuck-guard case asserts the guard's reload lands on the PRECACHED build A and that only a second tap escapes it; under network-first navigation that reload asks the server and lands on B, so the wedge the case pins cannot form. The manual-reload case reloads during a throttled install and expects the old worker's precached shell to boot at once; here the reload takes build B's shell from the server and then waits for B's entry chunk through the throttle the case holds until afterwards — the accepted cost of this route (a reload during a slow install waits for the new build rather than showing the old one), and never a 404. Those two cases alone are skipped at their first line with the reason `network-first navigation by design`; every other case in the file runs unchanged."

