reason = "Collie schedules removals in its suite by reading its own version out of the root package.json: the `collie pack` alias must be gone at major 2 (cli/program.test.ts) and the protocol version 1 overlap at minor 9 (bridge/removal-schedule.test.ts). In this fork that file carries this product's own line (3.x), so the alias check fired two majors early against Collie 1.8.2 code, and the overlap check would have fired at a Fleet 3.9 while Collie was still 1.8. The Collie release is already recorded exactly once, in this manifest's [upstream].tag, and moves only with an adoption; the fork-owned fleet/upstream-version.ts reads it through the manifest's own validating parser, and each clock imports that one name in place of its package.json read. There is no shared reading point upstream — each test spells its own — so these two lines are the smallest common port; every removal assertion and its threshold stays upstream's, which is what lets the adoption that crosses 1.9.0 or 2.0.0 find its removals exactly as upstream intends. Rejected: moving package.json back to Collie's number (breaks this product's version rule and its three-file agreement) and skipping the two checks (loses the removal reminders)."

[[invasive]]
id = "downstream-docs"
intent = "Keep the Fleet runtime's own manual page in docs/ without making it a `collie` binary page."
strategy = "adapt"
