# The existing api.ts and types.ts ownership also covers fetchFleetReleases, FleetReleaseObservation,
# and FleetVersionView. These are typed read-only ports; discovery stays in fleet/version and does
# not call Collie's updater, add Pack fields, or give the browser installation authority.
reason = "Collie's capability, Pane state, route, lifecycle, API, and native Display surfaces expose only typed ports; geometry, validation, controller ownership, and result policy remain under fleet/. Since Collie 1.8 the forwarded route lives on the crew router (`bridge/crew/forward.ts`, `/crew/v1/pane/:id/resize`, documented in CREW_PROTOCOL.md) and rides upstream's generic one-release `/pack/v1/*` overlap in both directions because it is in the crew route table; the Display row asks the Pane's own Host (`useMuxCapability(\"resizePane\", scope)`) under upstream's per-host capability rule. It also carries the one relaxation of the app's Content-Security-Policy: the fetched CJK fallback (native-webfont-port) needs its provider origin in style-src and font-src, and script-src and connect-src are deliberately untouched, so that origin can serve no code and the app can open no channel to it. This entry also carries the Pane page's second downstream port — the native navigation shell reads the switcher sheet's content through one hook and stands its entry down at the rails' breakpoint (native-navigation-sidebars-port) — because the manifest attributes web/src/components/agent-chat.tsx and its test to exactly one entry. It carries a third for the same reason: the Pane screen's state badge in the strip row's existing trailing slot, the composer's status-word switch and its named dock, and the control row's one-rank layout (native-pane-chrome-port). It carries a FOURTH: the Pane-scoped keyboard commands (drive-the-fleet-from-the-keyboard) register through one hook on each of these two files and add no logic to either — the Pane page hands over the fit function its own Display control already calls plus one fixed-key sender guarded by the same read-only and unreachable-host checks, and the composer hands over the exact activate/deactivate pair behind its visible Type control, so there is one armed state and one cleanup path rather than a second mode. It carries a FIFTH, in the composer alone (split-the-composer-record-and-send-buttons): the draft row's record control is lifted out of the trailing slot and stood beside Send, so the microphone no longer depends on the box being empty and a draft can be dictated in turns rather than once. This one REVERSES an upstream decision — abdbf45 collapsed the two into one slot to buy the field a button's width, on the reasoning that nobody dictates a clause into a sentence they typed by hand — and a sync that resolves this hunk toward upstream restores the one-clip-per-message limit rather than a layout preference, so resolve it toward the fork and let composer-voice-rank-port's suite decide. No logic moves into the file: the control reuses the recorder hook, the capability predicate and the labels already there, and the two refusals it adds to Send are the ones the shared slot used to get for free by not existing during a clip or on an empty box. It carries a SIXTH, and this one is a REFUSAL rather than an addition (decline-the-centred-pane-column): upstream 28255ae centres this route at 768px above the phone breakpoint and claims a matching `wide` header, because on a 1366px iPad an ~620px mirror left half the screen empty beside a full-width header and composer. That emptiness is upstream's and not ours — this fork spends exactly that space on its two navigation rails — so the cap would apply a second time inside a column the shell has already bounded and would take width from the mirror rather than from nothing. The wrapper therefore keeps the phone bound alone and the route makes no width claim, which is upstream's own default. The `wide` option stays where upstream put it, unclaimed: declining to use an option is narrower than deleting it. This entry exists so that a later release touching these lines is REPORTED by the adoption preflight rather than inherited, which is exactly how the cap arrived. v1.5.2 was that release and the preflight did report it: 3870c1c turns the flat 768px into a ladder to 1024, 1280 and 1400px and argues for it the way this entry argues against it \u2014 a mirror has a column count of its own and every pixel a cap withholds is a line the browser must wrap. The refusal is kept anyway, because a ladder is still a cap and the rails have already spent the emptiness it hands back; the header agrees by making no wide claim, so upstream's warning that the two must carry the identical ladder is satisfied by neither carrying one. The owner settled it on 2026-09-05 rather than leaving it open: the Pane and its transcript FILL the route column between the rails, and this fork does not adopt the ladder. A later adoption reviews this entry as decided, not as a question reopened by whatever upstream does to those four steps next. What would reopen it is a change on this side, not on upstream's \u2014 if the rails ever stop claiming the width the cap exists to fill, the emptiness the ladder answers would be back and so would its argument. It also carries the optional Pane content-renderer port (align-terminal-surface-width): the native Pane frame retains its existing AppBar, identity, actions and Find/Zen state while only the body is replaced. The port exposes native view state and output availability, not terminal vocabulary; the terminal renderer, fit inset and cell-aware search stay fork-owned. Copying the header into the terminal component would duplicate controls and allow the two surfaces to drift again."

