[[invasive]]
id = "downstream-version-line"
intent = "Carry this product's own version and its own release history in the files upstream's version gate reads."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.19.0"
paths = [
  "CHANGELOG.md#private Fleet configuration",
  "cli/update-check.test.ts#COLLIE_CHANGELOG.md",
  "scripts/release-notes.test.ts#COLLIE_CHANGELOG.md",
  "web/bun.lock#@xterm/xterm",
  "web/package.json#version"
]
verify = ["fleet/build-flag.test.ts", "scripts/check-version.sh", "cli/update-check.test.ts", "scripts/release-notes.test.ts"]
reason = "Three files plus the newest numbered changelog heading must agree on one version, and `scripts/check-version.sh` and the pre-commit changelog guard both read those filenames directly. Giving our changelog a new name would mean editing both of those upstream scripts — two invasive paths, in tooling — to say what this file now honestly is, so CHANGELOG.md keeps the canonical name and holds our entries — written in the bold-lead bullet shape upstream's changelog guard checks since 1.8, which this fork follows rather than porting the guard, and Collie's own history is retained beside it under its own name, which this file's header links — accumulatively, because upstream truncates that file and retaining Collie's history is not the same as retaining its bytes. Two upstream tests new by 1.14 read a Collie release section out of CHANGELOG.md — the protocol floor's heading in `cli/update-check.test.ts` and the contributor credits of 1.12.0 and 1.12.1 in `scripts/release-notes.test.ts`, joined by 1.15.0's — so each reads COLLIE_CHANGELOG.md for that section instead, with every assertion unchanged; the release-notes checks of this product's own newest section and Unreleased bullets still read CHANGELOG.md. The bump in the root package.json is the same one change and rides fleet-build-port, because this manifest allows one entry per path. web/package.json also carries the Fleet build's statement (`VITE_HERDR_FLEET=1` on its `build` script, native-navigation-sidebars-port), because every production bundle is built through that script and the manifest allows one entry per path. This entry also carries the fork's first DEPENDENCY on that file, and the lockfile that follows from it (attach-the-browser-to-the-real-terminal): the Pane's terminal surface renders a byte stream, which needs a terminal emulator in the browser, and `@xterm/xterm` with `@xterm/addon-fit` is that. Both are pinned exactly rather than by range — this is the code that interprets whatever a remote terminal emits, so which bytes it runs is not a resolver's choice — and the same reasoning as oxlint's exact pins in the root manifest. `web/bun.lock` joins the paths because it is the first lockfile this fork has ever moved: nothing upstream-owned had changed one before, so it had no classification, and a lockfile that changes outside the manifest is exactly the drift the boundary check exists to refuse."

[[invasive]]
id = "fleet-build-port"
intent = "Run the fork-owned Fleet modules' own typecheck and suites from the root package's scripts."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.19.0"
paths = ["package.json#fleet/tsconfig.json"]
verify = ["fleet/build-flag.test.ts", "fleet/config.test.ts", "fleet/collie-env.test.ts"]
reason = "The upstream root package owns the repository-wide entrypoints that `collie build`, the hooks and CI call. Since reduce-fork-footprint the Fleet runtime's TypeScript gate is its own fleet/tsconfig.json, which extends the root configuration, and the root `typecheck` script runs it as a third `tsc -p` beside upstream's two, so Collie's tsconfig.json is upstream's text. Collie's own `test` script is upstream's text too: the Fleet suites run from a fork `test:fleet` script (the fork workflow and the release gate run it), beside the existing `test:fork`. The version bump in this file is downstream-version-line's, carried here because the manifest allows one entry per path."

[[invasive]]
id = "native-agent-favorites-port"
intent = "Expose native Agent favorites as a star on Collie's own rows, worded through Fleet's own dictionary."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.19.0"
paths = [
  "web/src/components/agent-list.tsx#togglePanePin",
  "web/src/components/agent-list.test.tsx#the star is this device's pin",
  "web/src/components/agent-card.tsx#onFavoriteToggle",
  "web/src/routes/home.test.tsx#agentRows",
  "web/src/components/stable-order.test.tsx#native-agent-favorites-port",
  "web/e2e/pinned-panes.spec.ts#native-agent-favorites-port"
]
verify = [
  "fleet/ui/agent-favorites.test.ts",
  "web/src/components/agent-list.test.tsx",
  "web/src/components/fleet-agent-card-favorite.test.tsx",
  "web/src/components/agent-card.test.tsx",
  "web/e2e/pinned-panes.spec.ts",
  "web/src/routes/home.test.tsx",
  "web/src/components/stable-order.test.tsx",
  "web/src/lib/fleet-i18n/fleet-i18n.test.tsx"
]
reason = "Collie's native rows own rendering and navigation, so they expose only a star state and toggle port; the star is Collie's own per-device pin (align-rail-with-collie-rows), so the dashboard list passes its own pin matcher and a toggle that calls Collie's setPinned through web/src/lib/fleet-roster.ts, and Fleet keeps no favourite store of its own — fleet/ui/agent-favorites.ts is only the one-shot reader that migrates a retired favourite record into pins. This entry also carries the dashboard route test's coverage of the content width the native navigation shell removes so the route fills its column (native-navigation-sidebars-port), because the manifest attributes each path to exactly one entry. Collie's dictionaries are upstream's text since the 1.18.0 adoption: the star's two labels (home.favorite.add/remove, worded as pin and unpin in each language's own term for upstream's pin) and every other Fleet label live in the fork-owned web/src/lib/fleet-i18n, which follows Collie's active locale and falls back to English, so the card's port reads them through `ft` and subscribes with `useFleetLocale` beside upstream's own `useLocale`. Since Collie 1.12 the dashboard lays rows out as workspace groups in place order under a Pinned group, not as triage sections, and rows gained pin, hidden-machine and host/cache chips; the star sits on every row beside them, pinning or unpinning the row exactly as the hold and the actions sheet do, so a starred row is in upstream's Pinned group in upstream's order and no group is re-partitioned. The ATTENTION re-export this file used to carry is gone: upstream moved the set to web/src/lib/triage.ts, where the Fleet Agent rail now reads it. Upstream's cross-surface order test (web/src/components/stable-order.test.tsx, new by 1.12) reads the dashboard's order from every button in a group, so it reads only the buttons that carry the row's own slot, as this entry's other tests do; its expected orders are unchanged. Collie 1.17's order-toggle case reads the Pinned group's order from its buttons the same way, so it reads only the row-slot buttons too, with its expected order unchanged. Upstream's browser-tier Changes case (web/e2e/pinned-panes.spec.ts) counts a pinned group's buttons the same way and takes the same row-slot scoping. The card's own favorite cases live in the fork-owned web/src/components/fleet-agent-card-favorite.test.tsx, so upstream's card suite is upstream's text."

