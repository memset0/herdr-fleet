intent = "Let a Pane be drawn as its mirror or as the terminal it mirrors, by pointing one route's element and loader at fork-owned drop-ins."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.17.2"
paths = ["web/src/router.tsx#FleetPaneRoute"]
verify = [
  "fleet/ui/terminal/switch.test.ts",
  "fleet/ui/terminal/font.test.ts",
  "fleet/ui/terminal/link.test.ts",
  "fleet/ui/terminal/pool.test.ts",
  "fleet/ui/terminal/clipboard.test.ts",
  "web/src/components/fleet-pane-route.test.tsx",
  "web/src/components/fleet-pane-surface-toggle.test.tsx",
  "web/src/components/fleet-terminal.test.tsx"
]
reason = "The router names fork-owned surface and loader drop-ins while preserving its native route id. With the switch at its default the existing Pane loader runs; the terminal branch returns no mirror text, so polling does not read hidden output. Both surfaces now render the native DetailRoute frame through its separate body port, rather than replacing the whole frame and losing its header controls. Surface selection, terminal lifetime, geometry and clipboard behavior stay fork-owned, and the root connection banner continues to read the same no-mirror data shape."

[[invasive]]
id = "native-pane-content-port"
intent = "Forward an optional Pane body while retaining the native route metadata, identity and AppBar owner."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.17.2"
paths = ["web/src/routes/detail.tsx#renderContent"]
verify = ["web/src/components/fleet-pane-route.test.tsx", "web/src/routes/detail.test.tsx"]
reason = "The native route already owns scoped Pane lookup, fresh-Pane fallback, closed-Pane recovery and navigation. Forwarding one optional typed content renderer into AgentChat preserves all of them and keeps the same frame mounted across surface changes. Reimplementing that frame in a terminal-only route duplicated its header and omitted identity/actions; this port is narrower than extracting or copying the header. AgentChat itself is attributed to native-pane-page-port, whose rationale covers the matching body slot and the Chat gate."

[[invasive]]
id = "authenticated-navigation-cache"
intent = "Require a fresh Gateway decision before every document navigation."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.17.2"
