# The existing types.ts ownership also covers FleetVersionView, a typed read-only port filled from
# the crew census the loader already reads; it calls no Collie updater, adds no crew field, and gives
# the browser no installation authority.
reason = "Collie's capability, Pane state, route, lifecycle, API, and native Display surfaces expose only typed ports; geometry, validation, controller ownership, and result policy remain under fleet/. Since Collie 1.8 the forwarded route lives on the crew router (`bridge/crew/forward.ts`, `/crew/v1/pane/:id/resize`, documented in CREW_PROTOCOL.md); Collie 1.9 removed the `/pack/v1/*` overlap, so it rides the one crew prefix and protocol, unioned with upstream's `changes` read in the Pane route and the crew route table (upstream classifies `changes` as an unaudited read via `isPaneReadAction`, and resize stays a write); the Display row asks the Pane's own Host (`useMuxCapability(\"resizePane\", scope)`) under upstream's per-host capability rule. It also carries the one relaxation of the app's Content-Security-Policy: the fetched CJK fallback (native-webfont-port) needs its provider origin in style-src and font-src, and script-src and connect-src are deliberately untouched, so that origin can serve no code and the app can open no channel to it. This entry also carries the Pane page's second downstream port — the native navigation shell reads the switcher sheet's content through one hook and stands its entry down at the Agents rail's 96rem breakpoint, so between 80rem and 96rem, where only the hierarchy rail stands, the entry carries the Agents rail (native-navigation-sidebars-port) — because the manifest attributes web/src/components/agent-chat.tsx and its test to exactly one entry. It carries a third for the same reason: the strip row's trailing slot, where upstream pins a manual fold control, is left empty — the fold is automatic and the pane's state is Collie's own dots and header mark, so Fleet spells it nowhere else (native-pane-chrome-port); the composer's status-word switch, its named dock and the control row's one-rank layout were retired at Collie 1.14.2, whose actions belt and one-box composer replaced the surfaces they stood on, and the fork's app-bar host chip went with them because upstream names the machine on the pane header's path line. It carries a FOURTH: the Pane-scoped keyboard commands (drive-the-fleet-from-the-keyboard) register through one hook on each of these two files and add no logic to either — the Pane page hands over the fit function its own Display control already calls plus one fixed-key sender guarded by the same read-only and unreachable-host checks, and the composer hands over the exact activate/deactivate pair behind its visible Type control, so there is one armed state and one cleanup path rather than a second mode. It carries a FIFTH, in the composer alone (split-the-composer-record-and-send-buttons): the record control is lifted out of the trailing slot and stands, at the box's own size, after attach and before Send inside upstream's one-box composer (Collie 1.14.2), so the microphone no longer depends on the box being empty and a draft can be dictated in turns rather than once. This one REVERSES an upstream decision — abdbf45 collapsed the two into one slot to buy the field a button's width, on the reasoning that nobody dictates a clause into a sentence they typed by hand — and a sync that resolves this hunk toward upstream restores the one-clip-per-message limit rather than a layout preference, so resolve it toward the fork and let composer-voice-rank-port's suite decide. No logic moves into the file: the control reuses the recorder hook, the capability predicate and the labels already there, and Send refuses on `!hasDraft || recorder.busy`, upstream's own `hasDraft` (attachments count) and the one refusal the shared slot used to get for free by not existing during a clip. It carries a SIXTH, and this one is a REFUSAL rather than an addition (decline-the-centred-pane-column): upstream 28255ae centres this route at 768px above the phone breakpoint and claims a matching `wide` header, because on a 1366px iPad an ~620px mirror left half the screen empty beside a full-width header and composer. That emptiness is upstream's and not ours — this fork spends exactly that space on its two navigation rails — so the cap would apply a second time inside a column the shell has already bounded and would take width from the mirror rather than from nothing. The wrapper therefore keeps the phone bound alone and the route makes no width claim, which is upstream's own default. The `wide` option stays where upstream put it, unclaimed: declining to use an option is narrower than deleting it. This entry exists so that a later release touching these lines is REPORTED by the adoption preflight rather than inherited, which is exactly how the cap arrived. v1.5.2 was that release and the preflight did report it: 3870c1c turns the flat 768px into a ladder to 1024, 1280 and 1400px and argues for it the way this entry argues against it \u2014 a mirror has a column count of its own and every pixel a cap withholds is a line the browser must wrap. The refusal is kept anyway, because a ladder is still a cap and the rails have already spent the emptiness it hands back; the header agrees by making no wide claim, so upstream's warning that the two must carry the identical ladder is satisfied by neither carrying one. The owner settled it on 2026-09-05 rather than leaving it open: the Pane and its transcript FILL the route column between the rails, and this fork does not adopt the ladder. A later adoption reviews this entry as decided, not as a question reopened by whatever upstream does to those four steps next. What would reopen it is a change on this side, not on upstream's \u2014 if the rails ever stop claiming the width the cap exists to fill, the emptiness the ladder answers would be back and so would its argument. It also carries the optional Pane content-renderer port (align-terminal-surface-width): the native Pane frame retains its existing AppBar, identity, actions and Find/Zen state while only the body is replaced. The port exposes native view state and output availability, not terminal vocabulary; the terminal renderer, fit inset and cell-aware search stay fork-owned. Copying the header into the terminal component would duplicate controls and allow the two surfaces to drift again. Upstream's Codex padding case (web/e2e/codex-padding.spec.ts, new by 1.14) compares the gap below the last transcript line for two agents whose session notes differ in length; it holds only inside upstream's 768px column, where both notes wrap to two lines. With the column declined, on the tablet project the shorter note fits one line and the gap differs by that line, so the case is skipped on the tablet project alone; the phone project still runs it unchanged. Collie 1.15 moved the belt's Display panel out of the composer into a sheet the Pane page mounts and made its rows answer for the body on screen (Text size first, then the mirror's rows, or Chat's own); the Resize row is therefore handed by the Pane page straight to that sheet's `afterTextSize` slot, among the terminal body's rows directly below Text size and never among Chat's, and the composer's Display props and its `displayPrefsAfterTextSize` hole are gone, so web/src/components/composer.test.tsx is upstream's file again and composer.tsx keeps only the command registrations and the record control (anchored on `useFleetCommandAdapters`). The Pane page also carries pane-surface-route-port's one Chat gate, for the one-entry-per-path reason: Collie's Chat body is offered only while no fork content renderer is in place (`chatOffered`), so the terminal surface replaces whichever body Collie would draw, offers no Chat switch and starts no live session window."

