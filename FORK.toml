intent = "Run Collie's version-scheduled removal checks against the Collie release this tree carries, not against this product's own version line."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.15.0"
paths = ["cli/program.test.ts#upstreamVersion()"]
verify = [
  "cli/program.test.ts",
  "fleet/upstream-version.test.ts"
]
reason = "Collie schedules removals in its suite by reading its own version out of the root package.json: the `collie pack` alias must be gone at major 2 (cli/program.test.ts). In this fork that file carries this product's own line (3.x), so the alias check fired two majors early against Collie 1.x code. There was a second clock until Collie 1.9.0, the protocol version 1 overlap at minor 9 in bridge/removal-schedule.test.ts; that removal happened, the file became a tombstone with no version read, and it is upstream's file verbatim again. The Collie release is already recorded exactly once, in this manifest's [upstream].tag, and moves only with an adoption; the fork-owned fleet/upstream-version.ts reads it through the manifest's own validating parser, and each clock imports that one name in place of its package.json read. There is no shared reading point upstream, so this one line is the smallest port; the removal assertion and its threshold stay upstream's, which is what lets the adoption that crosses 2.0.0 find the removal exactly as upstream intends. Rejected: moving package.json back to Collie's number (breaks this product's version rule and its three-file agreement) and skipping the check (loses the removal reminder)."

[[invasive]]
id = "downstream-docs"
intent = "Keep the Fleet runtime's own manual page in docs/ without making it a `collie` binary page."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.15.0"
paths = ["cli/docs-embed.test.ts#herdr-fleet.md"]
verify = ["cli/docs-embed.test.ts"]
reason = "Collie 1.8 embeds its operator manual in the binary from a hand-written list in cli/docs-embed.ts and its test requires every docs/*.md on disk to be in that list; upstream's later pages join that list, and the one exclusion is unchanged. docs/herdr-fleet.md is the fork-owned Fleet page (fleet-runtime): it documents the Gateway, the Pane terminal surface and Fleet's configuration, none of which the `collie` binary serves, so embedding it would add a page to `collie docs` and to the table `collie skill` prints for agents, and it would need an edit to the upstream registry module that nothing else declares. Excluding that one stem from the test's disk listing costs the same single invasive path and changes no shipped behavior, so it is the narrower port; the page stays where upstream's docs live because that is where an operator of this product looks."

[[invasive]]
id = "claude-manage-hint-port"
intent = "TEMPORARY compatibility port: keep Claude Code 2.1.286's background-work hint on the mode line from reading as a dialog key hint, until upstream reads it itself."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.15.0"
paths = [
  "web/src/lib/harness/claude/chrome.ts#namesAMenuKey(withoutClaudeManageHint(text))",
  "web/src/lib/harness/claude/index.ts#namesAMenuKey(withoutClaudeManageHint(t))"
]
verify = [
  "web/src/lib/harness/claude/fleet-manage-hint.test.ts",
  "web/src/lib/harness/claude/chrome.test.ts",
  "web/src/lib/harness/claude/input-box-frame.test.ts",
  "web/src/lib/harness/unread-dialog.test.ts",
  "web/src/lib/harness/conformance.test.ts"
]
reason = "Claude Code 2.1.286 mode line; upstream unaware as of v1.15.0, whose ledger verifies Claude Code 2.1.285. While background agents run Claude appends `· ← N agents · ↓ to manage` to its mode line (clipped to `↓ to ma…` in a narrow pane), and the Claude grammar's two statusline-tail checks — the input-box locator's no-menu-hint step and the adapter's modalOnScreen scan — read any `<key> to <verb>` segment with a sendable key as a dialog footer, and `↓` is sendable. So a healthy working screen lost its composer and wore the unread-dialog card. The decision lives in the fork-owned web/src/lib/fleet-claude-mode-line.ts, which removes only that trailing segment on the permission-mode line; each check passes its row through it, one call per site, and every other row and every other `↓` hint keeps upstream's reading. menu-hints.ts is shared by every harness and the generic menu, so teaching it was the wider port and was rejected. THIS PORT IS TEMPORARY: an upstream pull request will be opened from the owner's own fork of Collie, and at the first upstream sync that adopts a release carrying that fix, both call sites return to upstream's text and this entry, the helper, its suite, its fixtures and the claude-mode-line-compat owned entry are removed."

[[invasive]]
id = "codex-headless-status-row-port"
intent = "TEMPORARY compatibility port: read a headless Codex's multi-item status row, and its right-aligned notice, as the status row it is, until upstream reads it itself."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.15.0"
paths = [
  "web/src/lib/harness/codex/markers.ts#withFleetCodexStatusSegments(splitPaintedGaps(folded))",
  "web/src/lib/harness/invariants.test.ts#DOWNSTREAM PORT (FORK.toml codex-headless-status-row-port)"
]
verify = [
  "web/src/lib/harness/codex/fleet-headless-status-row.test.ts",
  "web/src/lib/harness/codex.test.ts",
  "web/src/lib/harness/invariants.test.ts",
  "web/src/lib/harness/unread-dialog.test.ts",
  "web/src/lib/harness/conformance.test.ts"
]
reason = "temporary until upstream reads headless multi-item status rows; retire at the sync adopting that release. Codex 0.156.1 with no colour answered and a user-configured multi-item status_line; upstream unaware as of v1.15.0, whose own notice rule says no headless notice was captured and whose paint-invariance suite pinned this repaint as a known gap. Three renderings broke isStyledStatusRow: from the fourth item the space before a separator is painted in the item's colour (`main␠` + `· `), the gap and the notice's `⚠ ` merge into one unpainted segment, and the notice's glue text and bold key carry no colour. So composerReady was false and, Codex declaring no modalOnScreen, an idle pane wore the unread-dialog card. The decision lives in the fork-owned web/src/lib/fleet-codex-status-row.ts: withFleetCodexStatusSegments repairs the two splits on the folded segments before upstream's loop runs — since Collie 1.15.0 on what upstream's own splitPaintedGaps (#317, a goal notice's padding painted in the field's colour) hands back, so the two repairs layer on upstream's and touch none of its cases, exactly as the owner's upstream pull request integrates them — and fleetReadsUnpaintedNotice lets isRightNotice accept an uncoloured notice segment only when the row's separators are themselves plain. The markers.ts port is one import, the normalising call (the anchor), one parameter on isRightNotice, its one refusal line asking the helper, and the paint passed at its call site; re-implementing the notice check in the helper would duplicate upstream's bounds, and pre-marking segments dim would misstate the paint and loosen the inner-gap rule, so both were rejected. invariants.test.ts loses the known-gap entry the suite itself says to delete once the reader learns the paint (left in, its it.fails turns red); the anchor comment marks the spot. Every upstream fixture replays unchanged, the #317 goal-notice capture and the Codex 0.159.2 captures included; Collie 1.15.0 reads the goal padding and still not the headless multi-item row, so the port stays. THIS PORT IS TEMPORARY: an upstream issue and pull request are opened from the owner's own fork of Collie, and at the first upstream sync that adopts a release carrying that fix, markers.ts and invariants.test.ts return to upstream's text and this entry, the helper, its suite, its fixtures and the codex-status-row-compat owned entry are removed."
