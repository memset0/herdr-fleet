ork-first navigation by design`; both still exist in 1.15.0's suite on the same premise (the old worker answering a reload from its precache), so both skips stay, and every other case in the file runs unchanged. Collie 1.18 brought an offline read-only mode that needs the app to open with no network, so the route now answers from the precached `index.html` when, and only when, the request itself fails and the path is outside upstream's network-only denylist (`navigationNetworkOnlyUnder`, upstream's again); any HTTP answer, a Gateway 401 or redirect included, is returned untouched and nothing is cached. The decision lives in the fork-owned web/src/lib/fleet-navigation.ts and sw.ts calls it. Collie 1.18's own source test of the worker (web/src/lib/sw-routes.test.ts, `registers exactly two routes`) names upstream's precached-shell route; it reads the fork's route instead, with the route count, the font cache case and every other assertion unchanged."

