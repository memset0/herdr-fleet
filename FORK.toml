[[invasive]]
id = "native-row-actions-menu-port"
intent = "Let a pointer's context gesture answer a row's actions with the fork's own context menu, while a touch keeps Collie's bottom sheet exactly as upstream wrote it."
strategy = "adapt"
review = "every-upstream-sync"
paths = [
  "web/src/components/pane-strip.tsx#FleetPaneActions",
  "web/src/components/tab-strip.tsx#FleetTabActions"
]
verify = [
  "fleet/ui/menu-placement.test.ts",
  "fleet/ui/pointer-menu.test.ts",
  "web/src/components/fleet-row-actions.test.tsx",
  "web/src/components/pane-actions-sheet.test.tsx",
  "web/src/components/pane-strip.test.tsx",
  "web/src/components/tab-actions-sheet.test.tsx",
  "web/src/components/tab-strip.test.tsx"
]
reason = "A bottom sheet and a context menu answer the same question and are not the same object: one dims the app, sticks a titled header over it and spends a thumb's 44px per verb; the other stands at the cursor, dims nothing and leaves when you look away. Collie's sheet primitive and both actions sheets are therefore untouched — the fork adds its own menu and its own centred prompt, and each strip changes by one imported name to a drop-in that takes the same props and renders the same sheet unless a mouse's context gesture opened it. The rows the menu draws are its own; every rule they run on — the capability gates, the host write block, the two-tap confirm, the press echo, the API calls and the status strings — is imported from where the sheet gets it, so the two surfaces can differ in shape and cannot differ in what they do. Geometry and the record of which gesture opened a surface stay under fleet/ui. The fork's hierarchy uses the same drop-in without any upstream change at all."

[[invasive]]
id = "unnarrowed-pack-rows-port"
intent = "Let a navigator that presents the WHOLE pack read the rows the lead merged, without changing the narrowed lists every view of one machine already reads."
strategy = "adapt"
review = "every-upstream-sync"
paths = [
  "web/src/lib/loaders.ts#allWorkspaces?: WorkspaceView[]"
]
verify = [
  "fleet/ui/native-navigation/model.test.ts",
  "web/src/components/native-navigation-shell.test.tsx",
  "web/src/components/native-navigation-tree.test.tsx"
]
reason = "The loader narrows spaces and tabs to the address the URL is on, which is right for every Collie surface that reads them because each is a view OF one machine. The fork's hierarchy is the one surface that is a view of the PACK, and the narrowing cannot be undone downstream — the other machines' rows are simply gone by then. So the loader carries both answers: the narrowed lists keep their name, their type and their every consumer untouched, and two optional siblings — allWorkspaces and allTabs, anchored here by the first — carry the merged rows verbatim. Optional so that every existing constructor of this shape stays valid unedited, and a reader falls back to the narrowed list, which on the solo bodies those constructors describe is the same rows. No Collie surface reads the new fields, and the fork adds no logic to this file."

[[invasive]]
id = "repository-guidance"
intent = "Make downstream instructions canonical and exclude machine-local Fleet configuration."
strategy = "adapt"
review = "every-upstream-sync"
paths = [
  ".gitignore#/fleet.toml",
  "AGENTS.md#Repository-specific OpenSpec and Git Workflow Requirements",
  "CLAUDE.md#AGENTS.md"
]
verify = ["AGENTS.md", ".gitignore"]
reason = "Repository entrypoints and ignore rules are upstream-owned surfaces that every contributor consumes."

[[invasive]]
id = "fake-network-fleet-routes"
intent = "Teach the shared MSW handlers about Fleet's own authenticated route."
strategy = "adapt"
review = "every-upstream-sync"
paths = ["web/src/test/handlers.ts#/fleet/api/settings"]
verify = ["web/src/routes/settings.test.tsx", "web/src/playground/app.test.tsx"]
reason = "The app now has one endpoint Collie does not, and the shared fake network is where every suite learns what the network answers. The handler returns 404 — exactly what a Collie with no Fleet Gateway in front of it answers — so Collie's own suites keep rendering Settings unchanged and the fork's editor simply does not appear. Without it the route's one fetch never settles under MSW and every render of Settings warns about an unhandled request."

[[invasive]]
id = "lint-parse-boundary"
intent = "Register the fork's own JSON parse boundary in the linter's existing boundary override."
strategy = "adapt"
review = "every-upstream-sync"
paths = [".oxlintrc.json#fleet/settings/document.ts"]
verify = ["fleet/settings/document.test.ts", "fleet/settings/gateway-settings.test.ts"]
reason = "ADR 0019 makes a finding fixable in code and never suppressible, and names one override class for files that ARE the I/O boundary the `no-runtime-typeof` rule tells you to parse at. The fork's settings document is that class a fourth time — one reader of an operator-authored JSON file, the Gateway route that replaces it, and that route's answer read back in the browser — so the three files join the existing list rather than carrying a disable comment. No rule is added, removed, or downgraded."

[[invasive]]
id = "plugin-identity"
intent = "Expose the downstream identity, Herdr-owned lifecycle, and inherited native operator actions while retaining Collie provenance."
strategy = "adapt"
review = "every-upstream-sync"
paths = ["herdr-plugin.toml#memset0.herdr-fleet"]
verify = ["herdr-plugin.toml", "UPSTREAM.md", "fleet/lifecycle.test.ts"]
reason = "Herdr reads plugin identity, build steps, and actions only from the upstream manifest path."

[[invasive]]
id = "downstream-version-line"
intent = "Carry this product's own version and its own release history in the files upstream's version gate reads."
strategy = "adapt"
review = "every-upstream-sync"
paths = [
  "CHANGELOG.md#private Fleet configuration",
  "web/package.json#version"
]
verify = ["scripts/check-version.sh"]
reason = "Three files plus the newest numbered changelog heading must agree on one version, and `scripts/check-version.sh` and the pre-commit changelog guard both read those filenames directly. Giving our changelog a new name would mean editing both of those upstream scripts — two invasive paths, in tooling — to say what this file now honestly is, so CHANGELOG.md keeps the canonical name and holds our entries, and Collie's own history is retained byte-identical beside it under its own name, which this file's header links. The bump in the root package.json is the same one change and rides fleet-build-port, because this manifest allows one entry per path."

[[invasive]]
id = "fleet-build-port"
intent = "Include fork-owned Fleet modules in existing root test and typecheck gates."
strategy = "adapt"
review = "every-upstream-sync"
paths = ["package.json#./fleet", "tsconfig.json#\"fleet\""]
verify = ["fleet/config.test.ts", "fleet/collie-env.test.ts"]
reason = "The upstream root package and TypeScript configuration own the repository-wide verification entrypoints."

[[invasive]]
