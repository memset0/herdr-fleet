reason = "The root outlet, the one header, the Pane page and the four routes that opted into a reading column are Collie-owned. Each keeps its own behavior and receives only a narrow port: one optional leading node on the header row, one mark primitive in its claim, one hook the Pane page reads for its existing switcher sheet plus the breakpoint at which the page hands upstream's actions belt no switcher handle (the grip above the composer that once carried a breakpoint class is gone since Collie 1.9), the shell/header nesting in the root route, and the removal of a content cap with its matching width claim, and the mount of the CJK fallback settings card (native-webfont-port). The Settings route takes one further port from drive-the-fleet-from-the-keyboard: the fork's own settings are gathered into one group at the HEAD of the page, which is the page's only heading and a deliberate exception to the flat-stack rule stated at that line — the boundary between what this fork adds and what Collie ships is the one thing a reader of that page cannot otherwise see, and the CJK card moves into the group while every Collie card keeps its position and its reasoning. This manifest attributes each upstream path to exactly one entry, so the Pane page's switcher port (web/src/components/agent-chat.tsx, web/src/components/agent-chat.test.tsx) rides the native-manual-pane-fit-port declaration and the dashboard route's own test (web/src/routes/home.test.tsx) rides native-agent-favorites-port; both reasons name this shell. All state, derivation, elision, bounds, preference and presentation behavior remains under fleet/ui and the fork-owned components, and Agent rendering stays in the existing shared list. The rail's emphasis reads Collie's own ATTENTION set from web/src/lib/triage.ts rather than copying it, because which sections mean a person is wanted here is one rule and two versions of it would drift; it draws its section headers from triage's own section fields, since upstream removed the shared header helper with the dashboard's triage sections. The rails are the fleet's map, not a view of the dashboard: upstream's dashboard footer tabs (Panes, Focus, Changes) sit in the app column beside them, and a machine hidden, or a tab or workspace filter chosen on the dashboard, changes nothing in either rail. A pin is the one device choice the Agents rail honours, because its star is upstream's pin (align-rail-with-collie-rows): the rail leads with a Pinned group in upstream's pinned order, and its row is drawn at upstream's agent-row density with upstream's dot, unseen mark, pane meta and round star. The Agents rail stands from 96rem and the hierarchy from 80rem, capped below 96rem so the route column keeps at least 66rem. Settings keeps the fork group at its head beside upstream's newer cards. Collie 1.8 added three tests that look at the whole layout and so meet the rails; each takes one scoping port and no assertion is weakened for the route column itself. The safe-area count in routes/root.test.tsx counts the app's own column: the two rails are columns beside it that yield the inset to the strip band exactly as the header does (asserted in the fork's shell test, after that count exposed the rails still reserving it under an open band), and the hierarchy drawer is a fixed layer over the whole viewport that clears the notch for itself as upstream's sheet primitive does. The playground walkthrough (motion.test.tsx) and the browser-tier smoke case (e2e/smoke.spec.ts) find a pane row or workspace label that the Agents or Herds rail also lists, so both look inside the route's own main region; the smoke case's first match was the rail's copy, hidden below the rail breakpoint. Collie 1.12–1.14's browser tier meets the shell in four more files, settled the same way. The dashboard footer's all-clear case looks inside main, since the Agents rail says the same line. Two cases drive the Pane switcher: it holds the Agents rail here, so the back-goes-up hop