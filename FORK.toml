reason = "The upstream service worker owns the app-shell navigation order and is the only place an authenticated document cache can be bypassed. Reviewed against Collie 1.17.2 and kept (its one worker change carries the push's machine into the notification data): upstream still answers every navigation outside its mount-scoped denylist (`navigationNetworkOnlyUnder(MOUNT)`: API, `/auth`, proxy namespaces, `/crew/v1`, `/standby`) from the precached shell, so an expired session could still recover a cached authenticated shell. The fork's network-first route is registered first and supersedes that whole route; only upstream's precached-shell `NavigationRoute` and its `createHandlerBoundToURL` and `navigationNetworkOnlyUnder` imports are dropped, while the `PRECACHE_MANIFEST` indirection, its progress plugin, the mount helpers, the in-app notification open and Collie 1.15's translated push titles (read from the Cache Storage table the page leaves, which network-first navigation never touches) stay upstream's. Collie is served at the root (Fleet resets and guards `COLLIE_BASE_PATH`), so the network-first route needs no mount. Collie 1.8's browser tier brought two cases this route contradicts by design, both resting on the old worker answering a navigation from its precache. The stuck-guard case asserts the guard's reload lands on the PRECACHED build A and that only a second tap escapes it; under network-first navigation that reload asks the server and lands on B, so the wedge the case pins cannot form. The manual-reload case reloads during a throttled install and expects the old worker's precached shell to boot at once; here the reload takes build B's shell from the server and then waits for B's entry chunk through the throttle the case holds until afterwards — the accepted cost of this route (a reload during a slow install waits for the new build rather than showing the old one), and never a 404. Those two cases alone are skipped at their first line with the reason `network-first navigation by design`; both still exist in 1.15.0's suite on the same premise (the old worker answering a reload from its precache), so both skips stay, and every other case in the file runs unchanged."

