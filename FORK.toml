[[invasive]]
id = "native-manual-pane-fit-port"
intent = "Expose one explicit Herdr-only Pane fit through Collie's native Display Settings and protected Pane lifecycle."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.5.2"
paths = [
  "bridge/index.ts#manualPaneFit",
  "bridge/mux/capabilities.ts#resizePane",
  "bridge/mux/herdr/adapter.ts#resizePane",
  "bridge/mux/types.ts#viewportRows",
  "bridge/pack/forward.ts#resize",
  "bridge/pack/forward.test.ts#paneActionsDeclaredIn",
  "PACK_PROTOCOL.md#/pack/v1/pane/:id/resize",
  "bridge/server.ts#manualPaneFit",
  "bridge/solo-baseline.test.ts#resize",
  "bridge/sessions.ts#dispose",
  "bridge/sessions.test.ts#downstream",
  "bridge/state-engine.ts#paneViewportRows",
  "bridge/state-engine.test.ts#viewportRows",
  "bridge/types.ts#viewportRows",
  "web/src/components/agent-chat.tsx#runManualPaneFit",
  "web/src/components/agent-chat.test.tsx#explicit manual Pane fit",
  "web/src/components/composer.tsx#displayPrefsAfterTextSize",
  "web/src/components/composer.test.tsx#Custom",
  "web/src/components/display-prefs.tsx#afterTextSize",
  "web/src/lib/api.ts#resizePane",
  "web/src/lib/ack-manifest.ts#resizePane",
  "web/src/lib/mux-capability.ts#resizePane",
  "web/src/lib/mux-capability.test.ts#manual Pane fit",
  "web/src/lib/types.ts#resizePane"
]
verify = [
  "fleet/manual-pane-fit/action.test.ts",
  "fleet/manual-pane-fit/capability.test.ts",
  "bridge/pack/forward.test.ts",
  "fleet/manual-pane-fit/controller.test.ts",
  "fleet/ui/manual-pane-fit.test.ts",
  "bridge/state-engine.test.ts",
  "bridge/sessions.test.ts",
  "web/src/components/agent-chat.test.tsx",
  "web/src/components/composer.test.tsx",
  "web/src/lib/mux-capability.test.ts",
  "web/src/lib/i18n/i18n.test.ts"
]
reason = "Collie's capability, Pane state, route, lifecycle, API, and native Display surfaces expose only typed ports; geometry, validation, controller ownership, and result policy remain under fleet/. It also carries the one relaxation of the app's Content-Security-Policy: the fetched CJK fallback (native-webfont-port) needs its provider origin in style-src and font-src, and script-src and connect-src are deliberately untouched, so that origin can serve no code and the app can open no channel to it. This entry also carries the Pane page's second downstream port — the native navigation shell reads the switcher sheet's content through one hook and stands its entry down at the rails' breakpoint (native-navigation-sidebars-port) — because the manifest attributes web/src/components/agent-chat.tsx and its test to exactly one entry. It carries a third for the same reason: the Pane screen's state badge in the strip row's existing trailing slot, the composer's status-word switch and its named dock, and the control row's one-rank layout (native-pane-chrome-port). It carries a FOURTH: the Pane-scoped keyboard commands (drive-the-fleet-from-the-keyboard) register through one hook on each of these two files and add no logic to either — the Pane page hands over the fit function its own Display control already calls plus one fixed-key sender guarded by the same read-only and unreachable-host checks, and the composer hands over the exact activate/deactivate pair behind its visible Type control, so there is one armed state and one cleanup path rather than a second mode. It carries a FIFTH, in the composer alone (split-the-composer-record-and-send-buttons): the draft row's record control is lifted out of the trailing slot and stood beside Send, so the microphone no longer depends on the box being empty and a draft can be dictated in turns rather than once. This one REVERSES an upstream decision — abdbf45 collapsed the two into one slot to buy the field a button's width, on the reasoning that nobody dictates a clause into a sentence they typed by hand — and a sync that resolves this hunk toward upstream restores the one-clip-per-message limit rather than a layout preference, so resolve it toward the fork and let composer-voice-rank-port's suite decide. No logic moves into the file: the control reuses the recorder hook, the capability predicate and the labels already there, and the two refusals it adds to Send are the ones the shared slot used to get for free by not existing during a clip or on an empty box. It carries a SIXTH, and this one is a REFUSAL rather than an addition (decline-the-centred-pane-column): upstream 28255ae centres this route at 768px above the phone breakpoint and claims a matching `wide` header, because on a 1366px iPad an ~620px mirror left half the screen empty beside a full-width header and composer. That emptiness is upstream's and not ours — this fork spends exactly that space on its two navigation rails — so the cap would apply a second time inside a column the shell has already bounded and would take width from the mirror rather than from nothing. The wrapper therefore keeps the phone bound alone and the route makes no width claim, which is upstream's own default. The `wide` option stays where upstream put it, unclaimed: declining to use an option is narrower than deleting it. This entry exists so that a later release touching these lines is REPORTED by the adoption preflight rather than inherited, which is exactly how the cap arrived. v1.5.2 was that release and the preflight did report it: 3870c1c turns the flat 768px into a ladder to 1024, 1280 and 1400px and argues for it the way this entry argues against it \u2014 a mirror has a column count of its own and every pixel a cap withholds is a line the browser must wrap. The refusal is kept anyway, because a ladder is still a cap and the rails have already spent the emptiness it hands back; the header agrees by making no wide claim, so upstream's warning that the two must carry the identical ladder is satisfied by neither carrying one. The owner settled it on 2026-09-05 rather than leaving it open: the Pane and its transcript FILL the route column between the rails, and this fork does not adopt the ladder. A later adoption reviews this entry as decided, not as a question reopened by whatever upstream does to those four steps next. What would reopen it is a change on this side, not on upstream's \u2014 if the rails ever stop claiming the width the cap exists to fill, the emptiness the ladder answers would be back and so would its argument."

[[invasive]]
id = "declined-centred-history-column"
intent = "Keep the transcript on the same width as the Pane it belongs to, by declining upstream's centred column on both."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.5.2"
paths = ["web/src/routes/history.tsx#flex min-h-0 flex-1 flex-col"]
verify = [
  "web/src/components/app-header.test.tsx",
  "web/src/routes/history.tsx"
]
reason = "Upstream 28255ae gives the Pane and history screens a centred 768px column above the phone breakpoint and a matching `wide` header claim. The Pane's half of that refusal rides native-manual-pane-fit-port, which this manifest has already attributed that file to; history needs an entry of its own because nothing claimed it before. The two may not disagree: the transcript is the other half of the Pane screen and one navigation away from it, so a width they do not share makes the page jump sideways on the hop. The argument for declining is at the Pane's wrapper and in fleet-native-navigation-sidebars — the rails are what claims the width upstream's cap exists to fill, so inside them the cap takes width from a mirror rather than from emptiness. Declared here rather than left implicit because the cap reached this tree unopposed once: the adoption preflight reports the ports a release disturbs, and these lines had none. It earned that at the next adoption: v1.5.2 (3870c1c) replaced the flat cap with a ladder to 1400px and the preflight named this entry. The refusal is kept and re-argued against the ladder rather than the retired number, and the two halves still agree because the pane keeps its own. The owner settled that on 2026-09-05: both screens fill the route column, and the ladder is not adopted here. See native-manual-pane-fit-port for what would reopen it."

