schema_version = 1

[upstream]
url = "https://github.com/AltanS/collie.git"
tag = "v1.2.0"
tag_object = "0f98f28c9aaadd641c4bc5ac484190ee3ef7008c"
commit = "4618c90534d6f818ed6788b8db00e1582c5abfdc"

[[owned]]
id = "development-workflow"
intent = "Maintain downstream OpenSpec and agent integrations without changing Collie product behavior."
paths = [
  ".agents/**",
  ".claude/commands/**",
  ".claude/skills/**",
  ".opencode/**",
  "openspec/**"
]
contracts = ["downstream-only specifications", "OpenSpec 1.11.0 generated workflows"]
verify = ["openspec/config.yaml"]

[[owned]]
id = "fork-governance"
intent = "Keep the exact Collie provenance and every downstream path reviewable."
paths = [
  "FORK.toml",
  "UPSTREAM.md",
  "scripts/check-fork.ts",
  "scripts/check-fork.test.ts",
  "scripts/fork-manifest.ts",
  "scripts/fork-manifest.test.ts"
]
contracts = ["exact upstream identity", "complete changed-path classification"]
verify = ["scripts/check-fork.test.ts", "scripts/fork-manifest.test.ts"]

[[owned]]
id = "fleet-runtime"
intent = "Provide the private authenticated Fleet runtime outside Collie-owned modules."
paths = [
  "docs/herdr-fleet.md",
  "fleet/**",
  "scripts/herdr-fleet.sh",
  "web/src/components/native-agent-rail.test.tsx",
  "web/src/components/native-agent-rail.tsx",
  "web/src/components/native-navigation-shell.test.tsx",
  "web/src/components/native-navigation-shell.tsx",
  "web/src/components/native-navigation-tree.test.tsx",
  "web/src/components/native-navigation-tree.tsx"
]
contracts = [
  "private fleet.toml",
  "lead-only configuration",
  "sanitized Collie child environment",
  "bounded browser-local Agent favorites",
  "explicit Herdr-only manual Pane fit",
  "persistent native navigation sidebars"
]
verify = [
  "fleet/auth.test.ts",
  "fleet/collie-env.test.ts",
  "fleet/config.test.ts",
  "fleet/gateway.test.ts",
  "fleet/lifecycle.test.ts",
  "fleet/login-ui.test.ts",
  "fleet/proxy.test.ts",
  "fleet/protocol.test.ts",
  "fleet/rate-limit.test.ts",
  "fleet/server.test.ts",
  "fleet/session-store.test.ts",
  "fleet/sw-boundary.test.ts",
  "fleet/ui/agent-favorites.test.ts",
  "fleet/manual-pane-fit/action.test.ts",
  "fleet/manual-pane-fit/capability.test.ts",
  "fleet/manual-pane-fit/controller.test.ts",
  "fleet/ui/manual-pane-fit.test.ts",
  "fleet/ui/native-navigation/model.test.ts",
  "fleet/ui/native-navigation/preferences.test.ts"
]

[[invasive]]
id = "repository-guidance"
intent = "Make downstream instructions canonical and exclude machine-local Fleet configuration."
strategy = "adapt"
review = "every-upstream-sync"
paths = [
  ".gitignore#/fleet.toml",
  "AGENTS.md#Repository-specific OpenSpec and Git Workflow Requirements",
  "CLAUDE.md#AGENTS.md"
]
verify = ["AGENTS.md", ".gitignore"]
reason = "Repository entrypoints and ignore rules are upstream-owned surfaces that every contributor consumes."

[[invasive]]
id = "plugin-identity"
intent = "Expose the downstream identity, Herdr-owned lifecycle, and inherited native operator actions while retaining Collie provenance."
strategy = "adapt"
review = "every-upstream-sync"
paths = ["herdr-plugin.toml#memset0.herdr-fleet"]
verify = ["herdr-plugin.toml", "UPSTREAM.md", "fleet/lifecycle.test.ts"]
reason = "Herdr reads plugin identity, build steps, and actions only from the upstream manifest path."

[[invasive]]
id = "fleet-build-port"
intent = "Include fork-owned Fleet modules in existing root test and typecheck gates."
strategy = "adapt"
review = "every-upstream-sync"
paths = ["package.json#./fleet", "tsconfig.json#\"fleet\""]
verify = ["fleet/config.test.ts", "fleet/collie-env.test.ts"]
reason = "The upstream root package and TypeScript configuration own the repository-wide verification entrypoints."

[[invasive]]
id = "downstream-changelog"
intent = "Record functional downstream work under the existing unreleased release discipline."
strategy = "adapt"
review = "every-upstream-sync"
paths = ["CHANGELOG.md#private Fleet configuration"]
verify = ["CHANGELOG.md", "scripts/check-version.sh"]
reason = "The existing changelog is the single release history enforced by the upstream version gate."

[[invasive]]
id = "native-agent-favorites-port"
intent = "Expose fork-owned browser-local favorites through Collie's native Agent list and card."
strategy = "adapt"
review = "every-upstream-sync"
paths = [
  "web/src/components/agent-list.tsx#agentFavoriteStore",
  "web/src/components/agent-list.test.tsx#browser-local favorites",
  "web/src/components/agent-card.tsx#onFavoriteToggle",
  "web/src/components/agent-card.test.tsx#AgentCard favorite control",
  "web/src/routes/home.test.tsx#agentRows",
  "web/src/lib/i18n/messages/en.ts#home.favorite.add",
  "web/src/lib/i18n/messages/de.ts#home.favorite.add",
  "web/src/lib/i18n/messages/es.ts#home.favorite.add",
  "web/src/lib/i18n/messages/ja.ts#home.favorite.add",
  "web/src/lib/i18n/messages/ko.ts#home.favorite.add",
  "web/src/lib/i18n/messages/zh.ts#home.favorite.add"
]
verify = [
  "fleet/ui/agent-favorites.test.ts",
  "web/src/components/agent-list.test.tsx",
  "web/src/components/agent-card.test.tsx",
  "web/src/routes/home.test.tsx",
  "web/src/lib/i18n/i18n.test.ts"
]
reason = "Collie's native rows own rendering and navigation, so they expose only favorite state and toggle ports while all identity, storage, and ordering behavior remains under fleet/ui."

[[invasive]]
id = "authenticated-navigation-cache"
intent = "Require a fresh Gateway decision before every document navigation."
strategy = "adapt"
review = "every-upstream-sync"
paths = ["web/src/sw.ts#Authenticated app-shell boundary"]
verify = ["fleet/sw-boundary.test.ts", "web/src/lib/sw-routes.test.ts"]
reason = "The upstream service worker owns the app-shell navigation order and is the only place an authenticated document cache can be bypassed."

[[invasive]]
id = "native-manual-pane-fit-port"
intent = "Expose one explicit Herdr-only Pane fit through Collie's native Display Settings and protected Pane lifecycle."
strategy = "adapt"
review = "every-upstream-sync"
paths = [
  "bridge/index.ts#manualPaneFit",
  "bridge/mux/capabilities.ts#resizePane",
  "bridge/mux/herdr/adapter.ts#resizePane",
  "bridge/mux/types.ts#viewportRows",
  "bridge/server.ts#manualPaneFit",
  "bridge/solo-baseline.test.ts#resize",
  "bridge/sessions.ts#dispose",
  "bridge/sessions.test.ts#downstream",
  "bridge/state-engine.ts#paneViewportRows",
  "bridge/state-engine.test.ts#viewportRows",
  "bridge/types.ts#viewportRows",
  "web/src/components/agent-chat.tsx#runManualPaneFit",
  "web/src/components/agent-chat.test.tsx#explicit manual Pane fit",
  "web/src/components/composer.tsx#displayPrefsAfterTextSize",
  "web/src/components/composer.test.tsx#Custom",
  "web/src/components/display-prefs.tsx#afterTextSize",
  "web/src/lib/api.ts#resizePane",
  "web/src/lib/ack-manifest.ts#resizePane",
  "web/src/lib/mux-capability.ts#resizePane",
  "web/src/lib/mux-capability.test.ts#manual Pane fit",
  "web/src/lib/types.ts#resizePane"
]
verify = [
  "fleet/manual-pane-fit/action.test.ts",
  "fleet/manual-pane-fit/capability.test.ts",
  "fleet/manual-pane-fit/controller.test.ts",
  "fleet/ui/manual-pane-fit.test.ts",
  "bridge/state-engine.test.ts",
  "bridge/sessions.test.ts",
  "web/src/components/agent-chat.test.tsx",
  "web/src/components/composer.test.tsx",
  "web/src/lib/mux-capability.test.ts",
  "web/src/lib/i18n/i18n.test.ts"
]
reason = "Collie's capability, Pane state, route, lifecycle, API, and native Display surfaces expose only typed ports; geometry, validation, controller ownership, and result policy remain under fleet/."

[[invasive]]
id = "native-navigation-sidebars-port"
intent = "Wrap Collie's native route outlet with persistent local hierarchy and Agent sidebars while retaining the existing router, data loaders, Agent list, and Pane surfaces."
strategy = "adapt"
review = "every-upstream-sync"
paths = [
  "web/src/routes/root.tsx#NativeNavigationShell",
  "web/src/components/native-navigation-shell.tsx#NativeNavigationShell",
  "web/src/components/native-navigation-shell.test.tsx#NativeNavigationShell",
  "web/src/components/native-navigation-tree.tsx#NativeNavigationTree",
  "web/src/components/native-navigation-tree.test.tsx#NativeNavigationTree",
  "web/src/components/native-agent-rail.tsx#NativeAgentRail",
  "web/src/components/native-agent-rail.test.tsx#NativeAgentRail"
]
verify = [
  "fleet/ui/native-navigation/model.test.ts",
  "fleet/ui/native-navigation/preferences.test.ts",
  "web/src/components/native-navigation-shell.test.tsx",
  "web/src/components/native-navigation-tree.test.tsx",
  "web/src/components/native-agent-rail.test.tsx",
  "web/src/components/agent-list.test.tsx",
  "web/src/lib/i18n/i18n.test.ts"
]
reason = "The root outlet and native presentation surfaces are Collie-owned, so the fork adds only one persistent shell and exact responsive components while all state, derivation, bounds, and preference behavior remains under fleet/ui and Agent rendering stays in the existing shared list."
