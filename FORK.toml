back-goes-up hop finds the rail's dialog and its codex row by logo (and passes only because the shell opens every pane through upstream's ADR 0067 `open`, a replace from a pane), while the pinned-panes switcher case is skipped, because that sheet holds the Agents rail, whose own Pinned group is drawn in the rail's markup rather than upstream's switcher sections and is covered by web/src/components/native-agent-rail.test.tsx. The pinned-panes Changes case counts only the buttons carrying the row's slot, because every agent row also carries its star (native-agent-favorites-port). Six cases whose up control is the Collie mark on the Pane header — back-goes-up D and its slide case, and four pane-glide back-arrow cases — are skipped, because this route declines the mark (the mark claim above). Collie 1.15 made Settings an index of sections: the fork group stands at the head of the index, above the section rows, and the shared section shell (web/src/components/settings-page.tsx) loses the same reading-column cap and header claim the index does, so every Settings page fills the route column. Upstream's index test asserts the index carries no control of its own; it counts only the controls outside the fork's group, which stands there by design. The pane switcher's Place, Activity and cache orders (Collie 1.15) order upstream's switcher sections, which the sheet here does not draw because it holds the Agents rail; like a hidden machine or a dashboard tab, that order is a dashboard choice the rails do not follow, and so is the dashboard's own Activity or Cache order (Collie 1.17). Collie 1.17 added the Machines list and one machine's page (`/machines`, `/machines/:id`) with the same reading-column cap and header claim the Crew page had, so both lose them as Crew did. The dashboard footer's all-clear case now opens upstream's needs-you switch rather than the retired Focus tab, and still looks inside main."
