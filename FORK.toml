[[invasive]]
id = "native-row-actions-placement-port"
intent = "Let Collie's own Pane and Tab actions sheets stand where the gesture that opened them asks — at the cursor for a right-click, in the centre once they hold a rename's question — without changing a row, a rule, or a write."
strategy = "adapt"
review = "every-upstream-sync"
paths = [
  "web/src/components/pane-actions-sheet.tsx#useRowActionsPlace",
  "web/src/components/tab-actions-sheet.tsx#useRowActionsPlace",
  "web/src/components/ui/sheet.tsx#place?: SheetPlace"
]
verify = [
  "fleet/ui/menu-placement.test.ts",
  "fleet/ui/pointer-menu.test.ts",
  "web/src/components/fleet-pointer-menu.test.tsx",
  "web/src/components/pane-actions-sheet.test.tsx",
  "web/src/components/tab-actions-sheet.test.tsx",
  "web/src/components/ui/sheet.test.tsx"
]
reason = "Three surfaces ask a row for its actions — the fork's hierarchy and Collie's tab and pane strips — and all three already route both gestures through one hook into these two sheets. Only the presentation follows the gesture, so the sheets keep every row, capability gate, host block, confirm flow and write they have: the primitive gains one optional placement, and each sheet passes it plus the one fact only it knows, which is whether its rows have become a question. The geometry that answers where a menu goes, and the record of which gesture opened it, are under fleet/ui; the sheets and the primitive hold no downstream logic. The port is declared once here and reaches the strips without touching them."

[[invasive]]
id = "repository-guidance"
intent = "Make downstream instructions canonical and exclude machine-local Fleet configuration."
strategy = "adapt"
review = "every-upstream-sync"
paths = [
  ".gitignore#/fleet.toml",
  "AGENTS.md#Repository-specific OpenSpec and Git Workflow Requirements",
  "CLAUDE.md#AGENTS.md"
]
verify = ["AGENTS.md", ".gitignore"]
reason = "Repository entrypoints and ignore rules are upstream-owned surfaces that every contributor consumes."

[[invasive]]
id = "plugin-identity"
intent = "Expose the downstream identity, Herdr-owned lifecycle, and inherited native operator actions while retaining Collie provenance."
strategy = "adapt"
review = "every-upstream-sync"
paths = ["herdr-plugin.toml#memset0.herdr-fleet"]
verify = ["herdr-plugin.toml", "UPSTREAM.md", "fleet/lifecycle.test.ts"]
reason = "Herdr reads plugin identity, build steps, and actions only from the upstream manifest path."

[[invasive]]
id = "fleet-build-port"
intent = "Include fork-owned Fleet modules in existing root test and typecheck gates."
strategy = "adapt"
review = "every-upstream-sync"
paths = ["package.json#./fleet", "tsconfig.json#\"fleet\""]
verify = ["fleet/config.test.ts", "fleet/collie-env.test.ts"]
reason = "The upstream root package and TypeScript configuration own the repository-wide verification entrypoints."

[[invasive]]
id = "downstream-changelog"
intent = "Record functional downstream work under the existing unreleased release discipline."
strategy = "adapt"
review = "every-upstream-sync"
paths = ["CHANGELOG.md#private Fleet configuration"]
verify = ["CHANGELOG.md", "scripts/check-version.sh"]
reason = "The existing changelog is the single release history enforced by the upstream version gate."

[[invasive]]
id = "native-agent-favorites-port"
intent = "Expose fork-owned browser-local favorites through Collie's native Agent list and card."
strategy = "adapt"
review = "every-upstream-sync"
paths = [
  "web/src/components/agent-list.tsx#agentFavoriteStore",
  "web/src/components/agent-list.test.tsx#browser-local favorites",
  "web/src/components/agent-card.tsx#onFavoriteToggle",
  "web/src/components/agent-card.test.tsx#AgentCard favorite control",
  "web/src/routes/home.test.tsx#agentRows",
  "web/src/lib/i18n/messages/en.ts#home.favorite.add",
  "web/src/lib/i18n/messages/de.ts#home.favorite.add",
  "web/src/lib/i18n/messages/es.ts#home.favorite.add",
  "web/src/lib/i18n/messages/ja.ts#home.favorite.add",
  "web/src/lib/i18n/messages/ko.ts#home.favorite.add",
  "web/src/lib/i18n/messages/zh.ts#home.favorite.add"
]
verify = [
  "fleet/ui/agent-favorites.test.ts",
  "web/src/components/agent-list.test.tsx",
  "web/src/components/agent-card.test.tsx",
  "web/src/routes/home.test.tsx",
  "web/src/lib/i18n/i18n.test.ts"
]
reason = "Collie's native rows own rendering and navigation, so they expose only favorite state and toggle ports while all identity, storage, and ordering behavior remains under fleet/ui. This entry also carries the dashboard route test's coverage of the content width the native navigation shell removes so the route fills its column (native-navigation-sidebars-port), and the six typed dictionaries every downstream label lands in, including the CJK fallback card's (native-webfont-port), because the manifest attributes each of those paths to exactly one entry. It also carries one more named export out of the same file for the same one-rule reason: the dashboard's ATTENTION set, which decides where a card means 'a person is wanted here', is read by the Fleet Agent rail (native-navigation-sidebars-port) rather than copied into it."

[[invasive]]
id = "authenticated-navigation-cache"
intent = "Require a fresh Gateway decision before every document navigation."
strategy = "adapt"
review = "every-upstream-sync"
paths = ["web/src/sw.ts#Authenticated app-shell boundary"]
verify = ["fleet/sw-boundary.test.ts", "web/src/lib/sw-routes.test.ts"]
reason = "The upstream service worker owns the app-shell navigation order and is the only place an authenticated document cache can be bypassed."

[[invasive]]
id = "native-manual-pane-fit-port"
intent = "Expose one explicit Herdr-only Pane fit through Collie's native Display Settings and protected Pane lifecycle."
strategy = "adapt"
review = "every-upstream-sync"
paths = [
  "bridge/index.ts#manualPaneFit",
  "bridge/mux/capabilities.ts#resizePane",
  "bridge/mux/herdr/adapter.ts#resizePane",
  "bridge/mux/types.ts#viewportRows",
  "bridge/server.ts#manualPaneFit",
  "bridge/solo-baseline.test.ts#resize",
  "bridge/sessions.ts#dispose",
  "bridge/sessions.test.ts#downstream",
  "bridge/state-engine.ts#paneViewportRows",
  "bridge/state-engine.test.ts#viewportRows",
  "bridge/types.ts#viewportRows",
  "web/src/components/agent-chat.tsx#runManualPaneFit",
  "web/src/components/agent-chat.test.tsx#explicit manual Pane fit",
  "web/src/components/composer.tsx#displayPrefsAfterTextSize",
  "web/src/components/composer.test.tsx#Custom",
  "web/src/components/display-prefs.tsx#afterTextSize",
  "web/src/lib/api.ts#resizePane",
  "web/src/lib/ack-manifest.ts#resizePane",
  "web/src/lib/mux-capability.ts#resizePane",
  "web/src/lib/mux-capability.test.ts#manual Pane fit",
  "web/src/lib/types.ts#resizePane"
]
verify = [
  "fleet/manual-pane-fit/action.test.ts",
  "fleet/manual-pane-fit/capability.test.ts",
  "fleet/manual-pane-fit/controller.test.ts",
  "fleet/ui/manual-pane-fit.test.ts",
  "bridge/state-engine.test.ts",
  "bridge/sessions.test.ts",
  "web/src/components/agent-chat.test.tsx",
  "web/src/components/composer.test.tsx",
  "web/src/lib/mux-capability.test.ts",
  "web/src/lib/i18n/i18n.test.ts"
]
reason = "Collie's capability, Pane state, route, lifecycle, API, and native Display surfaces expose only typed ports; geometry, validation, controller ownership, and result policy remain under fleet/. It also carries the one relaxation of the app's Content-Security-Policy: the fetched CJK fallback (native-webfont-port) needs its provider origin in style-src and font-src, and script-src and connect-src are deliberately untouched, so that origin can serve no code and the app can open no channel to it. This entry also carries the Pane page's second downstream port — the native navigation shell reads the switcher sheet's content through one hook and stands its entry down at the rails' breakpoint (native-navigation-sidebars-port) — because the manifest attributes web/src/components/agent-chat.tsx and its test to exactly one entry. It carries a third for the same reason: the Pane screen's state badge in the strip row's existing trailing slot, the composer's status-word switch and its named dock, and the control row's one-rank layout (native-pane-chrome-port)."

[[invasive]]
id = "native-navigation-sidebars-port"
intent = "Wrap Collie's native route outlet and header with permanently expanded local hierarchy and Agent rails while retaining the existing router, data loaders, Agent list, header contract, and Pane surfaces."
strategy = "adapt"
review = "every-upstream-sync"
paths = [
  "web/src/routes/root.tsx#NativeNavigationShell",
  "web/src/components/app-header.tsx#leading?: ReactNode",
  "web/src/components/app-header.test.tsx#downstream leading node",
  "web/src/routes/home.tsx#flex min-h-0 w-full flex-1 flex-col",
  "web/src/routes/space.tsx#flex min-h-0 w-full flex-1 flex-col",
  "web/src/routes/settings.tsx#flex min-h-0 w-full flex-1 flex-col",
  "web/src/routes/pack.tsx#flex min-h-0 w-full flex-1 flex-col",
  "web/src/components/native-navigation-context.tsx#NativeNavigationProvider",
  "web/src/components/native-navigation-shell.tsx#NativeNavigationShell",
  "web/src/components/native-navigation-shell.test.tsx#NativeNavigationShell",
  "web/src/components/native-navigation-tree.tsx#NativeNavigationTree",
  "web/src/components/native-navigation-tree.test.tsx#NativeNavigationTree",
  "web/src/components/native-agent-card.tsx#NativeAgentCard",
  "web/src/components/native-agent-rail.tsx#NativeAgentRail",
  "web/src/components/native-agent-rail.test.tsx#NativeAgentRail"
]
verify = [
  "fleet/ui/native-navigation/model.test.ts",
  "fleet/ui/native-navigation/preferences.test.ts",
  "web/src/components/native-navigation-shell.test.tsx",
  "web/src/components/native-navigation-tree.test.tsx",
  "web/src/components/native-agent-rail.test.tsx",
  "web/src/components/app-header.test.tsx",
  "web/src/components/agent-chat.test.tsx",
  "web/src/routes/home.test.tsx",
  "web/src/components/agent-list.test.tsx",
  "web/src/lib/i18n/i18n.test.ts"
]
reason = "The root outlet, the one header, the Pane page and the four routes that opted into a reading column are Collie-owned. Each keeps its own behavior and receives only a narrow port: one optional leading node on the header row, one mark primitive in its claim, one hook the Pane page reads for its existing switcher sheet plus a breakpoint class on that entry, the shell/header nesting in the root route, and the removal of a content cap with its matching width claim, and the mount of the CJK fallback settings card (native-webfont-port). This manifest attributes each upstream path to exactly one entry, so the Pane page's switcher port (web/src/components/agent-chat.tsx, web/src/components/agent-chat.test.tsx) rides the native-manual-pane-fit-port declaration and the dashboard route's own test (web/src/routes/home.test.tsx) rides native-agent-favorites-port; both reasons name this shell. All state, derivation, elision, bounds, preference and presentation behavior remains under fleet/ui and the fork-owned components, and Agent rendering stays in the existing shared list. The rail's emphasis reads the dashboard's own exported set rather than copying it, because which sections mean a person is wanted here is one rule and two versions of it would drift; that export rides the native-agent-favorites-port declaration, since this manifest attributes web/src/components/agent-list.tsx to exactly one entry."
[[invasive]]
id = "native-pane-chrome-port"
intent = "Let the Pane screen say its state in a row it already spends, rank its controls as one, and decline the shared mark, without moving product logic into Collie-owned files."
strategy = "adapt"
review = "every-upstream-sync"
paths = [
  "web/src/components/collie-home.tsx#paper?: string",
  "web/src/components/strips-summary.tsx#trailing"
]
verify = [
  "web/src/components/app-header.test.tsx",
  "web/src/components/agent-chat.test.tsx",
  "web/src/components/composer.test.tsx"
]
reason = "The folded strips bar takes one trailing node so the pane's state survives the fold, drawn beside its button rather than inside it — the bar's accessible name is one exact sentence about what the control does, and a word appended to it would not be that sentence. Moving the header onto the chrome ground breaks the mark's knockout, which was written as the page colour inside the drawing. The mark takes the ground as a value with the page as its default, so a caller that says nothing gets Collie's own rendering and the existing coupling test keeps failing when the fill and the knockout disagree. The rest of this capability rides paths this manifest has already attributed once: the composer's status-word switch and dock anchor and the Pane page's badge and control row under native-manual-pane-fit-port, and the header's mark claim under native-navigation-sidebars-port."
[[invasive]]
id = "native-webfont-port"
intent = "Put one fetched fallback face under every font stack, after the operator's own and before the system's, and offer it and its Latin twin in the existing pickers."
strategy = "adapt"
review = "every-upstream-sync"
paths = [
  "web/src/index.css#--font-cjk",
  "web/src/hooks/use-display-prefs.ts#maple",
  "web/src/lib/design.ts#maple",
  "web/public/theme-init.js#font-maple",
  "web/src/components/typeface-control.tsx#maple",
  "web/src/components/typeface-control.test.tsx#Maple Mono NF CN",
  "web/src/components/font-settings.tsx#maple"
]
verify = [
  "fleet/ui/webfonts.test.ts",
  "web/src/lib/fleet-webfonts.test.ts",
  "web/src/components/typeface-control.test.tsx",
  "web/src/fonts.test.ts",
  "web/src/lib/i18n/i18n.test.ts"
]
reason = "A CJK face cannot be shipped — a full one is tens of megabytes paid by every install on every update — so it is fetched in unicode-range chunks and named in the stacks. Every stack lives in index.css and in one JS tail, so the fallback is one `var()` hole in each: unset it names a family nothing matches and the stacks are byte-for-byte what they were. The two pickers gain the same face as a Latin choice because it is the same download. Two paths this capability also touches are attributed elsewhere by this manifest, which allows one entry per path: the CSP origin in bridge/server.ts rides native-manual-pane-fit-port, the settings card's mount in web/src/routes/settings.tsx rides native-navigation-sidebars-port, and the six typed dictionaries ride native-agent-favorites-port."
