paths = ["cli/docs-embed.test.ts#herdr-fleet.md"]
verify = ["cli/docs-embed.test.ts"]
reason = "Collie 1.8 embeds its operator manual in the binary from a hand-written list in cli/docs-embed.ts and its test requires every docs/*.md on disk to be in that list. docs/herdr-fleet.md is the fork-owned Fleet page (fleet-runtime): it documents the Gateway, the Pane terminal surface and Fleet's configuration, none of which the `collie` binary serves, so embedding it would add a page to `collie docs` and to the table `collie skill` prints for agents, and it would need an edit to the upstream registry module that nothing else declares. Excluding that one stem from the test's disk listing costs the same single invasive path and changes no shipped behavior, so it is the narrower port; the page stays where upstream's docs live because that is where an operator of this product looks."
