verify = ["fleet/config.test.ts", "fleet/collie-env.test.ts"]
reason = "The upstream root package and TypeScript configuration own the repository-wide verification entrypoints."

[[invasive]]
id = "native-agent-favorites-port"
intent = "Expose native Agent favorites and own the shared typed dictionaries used by all Fleet labels, including runtime-version evidence."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.15.0"
paths = [
  "web/src/components/agent-list.tsx#togglePanePin",
  "web/src/components/agent-list.test.tsx#the star is this device's pin",
  "web/src/components/agent-card.tsx#onFavoriteToggle",
  "web/src/components/agent-card.test.tsx#AgentCard favorite control",
  "web/src/routes/home.test.tsx#agentRows",
  "web/src/components/stable-order.test.tsx#native-agent-favorites-port",
  "web/src/lib/i18n/messages/en.ts#home.favorite.add",
  "web/src/lib/i18n/messages/de.ts#home.favorite.add",
  "web/src/lib/i18n/messages/es.ts#home.favorite.add",
  "web/src/lib/i18n/messages/ja.ts#home.favorite.add",
  "web/src/lib/i18n/messages/ko.ts#home.favorite.add",
  "web/src/lib/i18n/messages/zh.ts#home.favorite.add",
  "web/src/lib/i18n/messages/zh-TW.ts#home.favorite.add"
]
verify = [
  "fleet/ui/agent-favorites.test.ts",
  "web/src/components/agent-list.test.tsx",
  "web/src/components/agent-card.test.tsx",
  "web/src/routes/home.test.tsx",
  "web/src/components/stable-order.test.tsx",
  "web/src/lib/i18n/i18n.test.ts"
]
# All seven dictionaries also carry fleet.version.*; classifier and hierarchy coverage verify
# their lead-relative runtime presentation, independent of connectivity.
reason = "Collie's native rows own rendering and navigation, so they expose only a star state and toggle port; the star is Collie's own per-device pin (align-rail-with-collie-rows), so the dashboard list passes its own pin matcher and a toggle that calls Collie's setPinned through web/src/lib/fleet-roster.ts, and Fleet keeps no favourite store of its own — fleet/ui/agent-favorites.ts is only the one-shot reader that migrates a retired favourite record into pins. This entry also carries the dashboard route test's coverage of the content width the native navigation shell removes so the route fills its column (native-navigation-sidebars-port), and the seven typed dictionaries every downstream label lands in, including the CJK fallback card's (native-webfont-port) and fleet.version.* runtime evidence, because the manifest attributes each of those paths to exactly one entry. Since Collie 1.12 the dashboard lays rows out as workspace groups in place order under a Pinned group, not as triage sections, and rows gained pin, hidden-machine and host/cache chips; the star sits on every row beside them, pinning or unpinning the row exactly as the hold and the actions sheet do, so a starred row is in upstream's Pinned group in upstream's order and no group is re-partitioned. The dictionaries keep the home.favorite.add/remove keys as this entry's anchors, worded as pin and unpin in each language's own term for upstream's pin. The ATTENTION re-export this file used to carry is gone: upstream moved the set to web/src/lib/triage.ts, where the Fleet Agent rail now reads it. Upstream's cross-surface order test (web/src/components/stable-order.test.tsx, new by 1.12) reads the dashboard's order from every button in a group, so it reads only the buttons that carry the row's own slot, as this entry's other tests do; its expected orders are unchanged."

[[invasive]]
id = "pane-surface-route-port"
intent = "Let a Pane be drawn as its mirror or as the terminal it mirrors, by pointing one route's element and loader at fork-owned drop-ins."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.15.0"
paths = ["web/src/router.tsx#FleetPaneRoute"]
verify = [
  "fleet/ui/terminal/switch.test.ts",
  "fleet/ui/terminal/font.test.ts",
  "fleet/ui/terminal/link.test.ts",
  "fleet/ui/terminal/pool.test.ts",
  "fleet/ui/terminal/clipboard.test.ts",
  "web/src/components/fleet-pane-route.test.tsx",
  "web/src/components/fleet-pane-surface-toggle.test.tsx",
  "web/src/components/fleet-terminal.test.tsx"
]
reason = "The router names fork-owned surface and loader drop-ins while preserving its native route id. With the switch at its default the existing Pane loader runs; the terminal branch returns no mirror text, so polling does not read hidden output. Both surfaces now render the native DetailRoute frame through its separate body port, rather than replacing the whole frame and losing its header controls. Surface selection, terminal lifetime, geometry and clipboard behavior stay fork-owned, and the root connection banner continues to read the same no-mirror data shape."

[[invasive]]
id = "native-pane-content-port"
intent = "Forward an optional Pane body while retaining the native route metadata, identity and AppBar owner."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.15.0"
paths = ["web/src/routes/detail.tsx#renderContent"]
verify = ["web/src/components/fleet-pane-route.test.tsx", "web/src/routes/detail.test.tsx"]
reason = "The native route already owns scoped Pane lookup, fresh-Pane fallback, closed-Pane recovery and navigation. Forwarding one optional typed content renderer into AgentChat preserves all of them and keeps the same frame mounted across surface changes. Reimplementing that frame in a terminal-only route duplicated its header and omitted identity/actions; this port is narrower than extracting or copying the header. AgentChat itself is already attributed to native-manual-pane-fit-port, whose rationale covers the matching body slot."

[[invasive]]
id = "authenticated-navigation-cache"
intent = "Require a fresh Gateway decision before every document navigation."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.15.0"
paths = [
  "web/src/sw.ts#Authenticated app-shell boundary",
  "web/e2e/service-worker.spec.ts#network-first navigation by design"
]
verify = ["fleet/sw-boundary.test.ts", "web/src/lib/sw-routes.test.ts", "web/e2e/service-worker.spec.ts"]
reason = "The upstream service worker owns the app-shell navigation order and is the only place an authenticated document cache can be bypassed. Reviewed against Collie 1.15.0 and kept: upstream still answers every navigation outside its mount-scoped denylist (`navigationNetworkOnlyUnder(MOUNT)`: API, `/auth`, proxy namespaces, `/crew/v1`, `/standby`) from the precached shell, so an expired session could still recover a cached authenticated shell. The fork's network-first route is registered first and supersedes that whole route; only upstream's precached-shell `NavigationRoute` and its `createHandlerBoundToURL` and `navigationNetworkOnlyUnder` imports are dropped, while the `PRECACHE_MANIFEST` indirection, its progress plugin, the mount helpers, the in-app notification open and Collie 1.15's translated push titles (read from the Cache Storage table the page leaves, which network-first navigation never touches) stay upstream's. Collie is served at the root (Fleet resets and guards `COLLIE_BASE_PATH`), so the network-first route needs no mount. Collie 1.8's browser tier brought two cases this route contradicts by design, both resting on the old worker answering a navigation from its precache. The stuck-guard case asserts the guard's reload lands on the PRECACHED build A and that only a second tap escapes it; under network-first navigation that reload asks the server and lands on B, so the wedge the case pins cannot form. The manual-reload case reloads during a throttled install and expects the old worker's precached shell to boot at once; here the reload takes build B's shell from the server and then waits for B's entry chunk through the throttle the case holds until afterwards — the accepted cost of this route (a reload during a slow install waits for the new build rather than showing the old one), and never a 404. Those two cases alone are skipped at their first line with the reason `network-first navigation by design`; both still exist in 1.15.0's suite on the same premise (the old worker answering a reload from its precache), so both skips stay, and every other case in the file runs unchanged."

[[invasive]]
id = "native-manual-pane-fit-port"
intent = "Expose protected native Pane ports and the already-owned browser API/type ports, including Fleet's read-only version view."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.15.0"
