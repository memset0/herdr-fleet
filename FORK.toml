[[invasive]]
id = "native-row-actions-menu-port"
intent = "Let a pointer's context gesture answer a row's actions with the fork's own context menu, while a touch keeps Collie's bottom sheet exactly as upstream wrote it."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.8.2"
paths = [
  "web/src/components/pane-strip.tsx#FleetPaneActions",
  "web/src/components/tab-strip.tsx#FleetTabActions"
]
verify = [
  "fleet/ui/menu-placement.test.ts",
  "fleet/ui/pointer-menu.test.ts",
  "web/src/components/fleet-row-actions.test.tsx",
  "web/src/components/pane-actions-sheet.test.tsx",
  "web/src/components/pane-strip.test.tsx",
  "web/src/components/tab-actions-sheet.test.tsx",
  "web/src/components/tab-strip.test.tsx"
]
reason = "A bottom sheet and a context menu answer the same question and are not the same object: one dims the app, sticks a titled header over it and spends a thumb's 44px per verb; the other stands at the cursor, dims nothing and leaves when you look away. Collie's sheet primitive and both actions sheets are therefore untouched — the fork adds its own menu and its own centred prompt, and each strip changes by one imported name to a drop-in that takes the same props and renders the same sheet unless a mouse's context gesture opened it. The rows the menu draws are its own; every rule they run on — the capability gates, the host write block, the two-tap confirm, the press echo, the API calls and the status strings — is imported from where the sheet gets it, so the two surfaces can differ in shape and cannot differ in what they do. Geometry and the record of which gesture opened a surface stay under fleet/ui. The fork's hierarchy uses the same drop-in without any upstream change at all."

[[invasive]]
id = "unnarrowed-pack-rows-port"
intent = "Expose whole-pack rows and optional cached Fleet version evidence without changing scoped lists or delaying the required snapshot."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.8.2"
paths = [
  "web/src/lib/loaders.ts#allWorkspaces?: WorkspaceView[]",
  "web/src/lib/loaders.test.ts#optional version discovery"
]
verify = [
  "fleet/version/release-observer.test.ts",
  "fleet/ui/version-evidence.test.ts",
  "web/src/lib/loaders.test.ts",
  "fleet/ui/native-navigation/model.test.ts",
  "web/src/components/native-navigation-shell.test.tsx",
  "web/src/components/native-navigation-tree.test.tsx"
]
reason = "The loader's scoped lists cannot recover rows already narrowed away, so optional allWorkspaces and allTabs preserve the lead's merged rows for the hierarchy while existing consumers and solo fallbacks remain unchanged. The same single-owner path also carries optional fleetVersions: the shared crew census (`fetchCrew`, `/api/crew` since Collie 1.8, never the previous path's one-release redirect) and Fleet release reads start beside the required snapshot, retain qualified evidence on failure, and never delay navigation. Host rows consume that cached view without requests or timers. The loader test is attributed here with both data ports rather than declaring the same implementation path twice."

[[invasive]]
id = "repository-guidance"
intent = "Keep canonical downstream guidance, local configuration exclusions, and the fixed metadata-only release-observation egress boundary explicit."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.8.2"
paths = [
  ".gitignore#/fleet.toml",
  "AGENTS.md#Repository-specific OpenSpec and Git Workflow Requirements",
  "CLAUDE.md#AGENTS.md"
]
verify = ["AGENTS.md", ".gitignore", "fleet/terminal/session.test.ts", "fleet/terminal/connection.test.ts", "fleet/terminal/spawn.test.ts"]
# The same AGENTS.md owner covers the fixed public Git-ref observer exception; it carries no
# credentials, arbitrary destination, browser egress, installation authority, or peer request.
reason = "Repository entrypoints and ignore rules are upstream-owned surfaces that every contributor consumes. This entry also carries the fork's recorded ADR 0008 departure: .adr/ is Collie's and is never written to, so the working agreement states the short downstream rule while the owning change's design explains it. The Pane's second surface uses terminal attach with automatic external-attachment takeover on lead and peer; it keeps one shared establishment and refuses another Fleet browser rather than displacing it. The mirror the ADR is about remains unchanged. The working agreement is the required normative entrypoint, so an owned document alone cannot replace this edit. Since Collie 1.8 upstream makes CLAUDE.md the canonical file and AGENTS.md a pointer to it; this fork keeps the reverse — AGENTS.md canonical and CLAUDE.md the relative symlink — and never reads upstream's CLAUDE.md into the link."

[[invasive]]
id = "fake-network-fleet-routes"
intent = "Teach the shared MSW handlers about Fleet's own authenticated routes."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.8.2"
paths = ["web/src/test/handlers.ts#Default happy-path handlers"]
verify = ["web/src/routes/settings.test.tsx", "web/src/lib/loaders.test.ts", "web/src/playground/app.test.tsx"]
reason = "The app has authenticated endpoints Collie does not, and the shared fake network is where every suite learns what the network answers. Settings returns 404 in the default solo Collie world; version observation returns bounded synthetic publication evidence, so tests stay hermetic and no render consults a live public source. Without these handlers the optional fetches warn as unhandled under MSW and Settings playground renders may never settle."

[[invasive]]
id = "lint-parse-boundary"
intent = "Register the fork's own JSON parse boundary in the linter's existing boundary override."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.8.2"
paths = [".oxlintrc.json#fleet/settings/document.ts"]
verify = ["fleet/settings/document.test.ts", "fleet/settings/gateway-settings.test.ts"]
reason = "ADR 0019 makes a finding fixable in code and never suppressible, and names one override class for files that ARE the I/O boundary the `no-runtime-typeof` rule tells you to parse at. The fork's settings document is that class a fourth time — one reader of an operator-authored JSON file, the Gateway route that replaces it, and that route's answer read back in the browser — so the three files join the existing list rather than carrying a disable comment. A fifth joins them with the Pane's terminal (attach-the-browser-to-the-real-terminal): `fleet/terminal/browser.ts` reads a viewport off a live WebSocket frame, and its one `typeof` is the object check that narrows an arbitrary parsed value to two integer fields before either becomes a real terminal's dimensions — the least trusted input in the list, and the only one whose parse result leaves the process. No rule is added, removed, or downgraded."

[[invasive]]
id = "plugin-identity"
intent = "Expose the downstream identity, Herdr-owned lifecycle, and inherited native operator actions while retaining Collie provenance."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.8.2"
paths = ["herdr-plugin.toml#memset0.herdr-fleet"]
verify = ["herdr-plugin.toml", "UPSTREAM.md", "fleet/lifecycle.test.ts"]
reason = "Herdr reads plugin identity, build steps, and actions only from the upstream manifest path."

[[invasive]]
id = "downstream-version-line"
intent = "Carry this product's own version and its own release history in the files upstream's version gate reads."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.8.2"
paths = [
  "CHANGELOG.md#private Fleet configuration",
  "web/bun.lock#@xterm/xterm",
  "web/package.json#version"
]
verify = ["scripts/check-version.sh"]
reason = "Three files plus the newest numbered changelog heading must agree on one version, and `scripts/check-version.sh` and the pre-commit changelog guard both read those filenames directly. Giving our changelog a new name would mean editing both of those upstream scripts — two invasive paths, in tooling — to say what this file now honestly is, so CHANGELOG.md keeps the canonical name and holds our entries — written in the bold-lead bullet shape upstream's changelog guard checks since 1.8, which this fork follows rather than porting the guard, and Collie's own history is retained beside it under its own name, which this file's header links — accumulatively, because upstream truncates that file and retaining Collie's history is not the same as retaining its bytes. The bump in the root package.json is the same one change and rides fleet-build-port, because this manifest allows one entry per path. This entry also carries the fork's first DEPENDENCY on that file, and the lockfile that follows from it (attach-the-browser-to-the-real-terminal): the Pane's terminal surface renders a byte stream, which needs a terminal emulator in the browser, and `@xterm/xterm` with `@xterm/addon-fit` is that. Both are pinned exactly rather than by range — this is the code that interprets whatever a remote terminal emits, so which bytes it runs is not a resolver's choice — and the same reasoning as oxlint's exact pins in the root manifest. `web/bun.lock` joins the paths because it is the first lockfile this fork has ever moved: nothing upstream-owned had changed one before, so it had no classification, and a lockfile that changes outside the manifest is exactly the drift the boundary check exists to refuse."

