[[invasive]]
id = "downstream-version-line"
intent = "Carry this product's own version and its own release history in the files upstream's version gate reads."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.15.0"
paths = [
  "CHANGELOG.md#private Fleet configuration",
  "cli/update-check.test.ts#COLLIE_CHANGELOG.md",
  "scripts/release-notes.test.ts#COLLIE_CHANGELOG.md",
  "web/bun.lock#@xterm/xterm",
  "web/package.json#version"
]
verify = ["scripts/check-version.sh", "cli/update-check.test.ts", "scripts/release-notes.test.ts"]
reason = "Three files plus the newest numbered changelog heading must agree on one version, and `scripts/check-version.sh` and the pre-commit changelog guard both read those filenames directly. Giving our changelog a new name would mean editing both of those upstream scripts — two invasive paths, in tooling — to say what this file now honestly is, so CHANGELOG.md keeps the canonical name and holds our entries — written in the bold-lead bullet shape upstream's changelog guard checks since 1.8, which this fork follows rather than porting the guard, and Collie's own history is retained beside it under its own name, which this file's header links — accumulatively, because upstream truncates that file and retaining Collie's history is not the same as retaining its bytes. Two upstream tests new by 1.14 read a Collie release section out of CHANGELOG.md — the protocol floor's heading in `cli/update-check.test.ts` and the contributor credits of 1.12.0 and 1.12.1 in `scripts/release-notes.test.ts`, joined by 1.15.0's — so each reads COLLIE_CHANGELOG.md for that section instead, with every assertion unchanged; the release-notes checks of this product's own newest section and Unreleased bullets still read CHANGELOG.md. The bump in the root package.json is the same one change and rides fleet-build-port, because this manifest allows one entry per path. This entry also carries the fork's first DEPENDENCY on that file, and the lockfile that follows from it (attach-the-browser-to-the-real-terminal): the Pane's terminal surface renders a byte stream, which needs a terminal emulator in the browser, and `@xterm/xterm` with `@xterm/addon-fit` is that. Both are pinned exactly rather than by range — this is the code that interprets whatever a remote terminal emits, so which bytes it runs is not a resolver's choice — and the same reasoning as oxlint's exact pins in the root manifest. `web/bun.lock` joins the paths because it is the first lockfile this fork has ever moved: nothing upstream-owned had changed one before, so it had no classification, and a lockfile that changes outside the manifest is exactly the drift the boundary check exists to refuse."

[[invasive]]
id = "fleet-build-port"
