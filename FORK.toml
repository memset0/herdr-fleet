[[invasive]]
id = "native-row-actions-menu-port"
intent = "Let a pointer's context gesture answer a row's actions with the fork's own context menu, while a touch keeps Collie's bottom sheet exactly as upstream wrote it."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.19.0"
paths = [
  "web/src/components/pane-strip.tsx#FleetPaneActions",
  "web/src/components/tab-strip.tsx#FleetTabActions"
]
verify = [
  "fleet/ui/menu-placement.test.ts",
  "fleet/ui/pointer-menu.test.ts",
  "web/src/components/fleet-row-actions.test.tsx",
  "web/src/components/pane-actions-sheet.test.tsx",
  "web/src/components/pane-strip.test.tsx",
  "web/src/components/tab-actions-sheet.test.tsx",
  "web/src/components/tab-strip.test.tsx"
]
reason = "A bottom sheet and a context menu answer the same question and are not the same object: one dims the app, sticks a titled header over it and spends a thumb's 44px per verb; the other stands at the cursor, dims nothing and leaves when you look away. Collie's sheet primitive and both actions sheets are therefore untouched — the fork adds its own menu and its own centred prompt, and each strip changes by one imported name to a drop-in that takes the same props and renders the same sheet unless a mouse's context gesture opened it. The rows the menu draws are its own; every rule they run on — the capability gates, the host write block, the two-tap confirm, the press echo, the API calls and the status strings — is imported from where the sheet gets it, so the two surfaces can differ in shape and cannot differ in what they do. Geometry and the record of which gesture opened a surface stay under fleet/ui. The fork's hierarchy uses the same drop-in without any upstream change at all."

[[invasive]]
id = "unnarrowed-pack-rows-port"
intent = "Expose whole-pack rows and optional Fleet version evidence from the crew census without changing scoped lists or delaying the required snapshot."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.19.0"
paths = [
  "web/src/lib/loaders.ts#allWorkspaces?: WorkspaceView[]"
]
verify = [
  "fleet/ui/version-evidence.test.ts",
  "web/src/lib/fleet-version-loader.test.ts",
  "web/src/lib/loaders.test.ts",
  "fleet/ui/native-navigation/model.test.ts",
  "web/src/components/native-navigation-shell.test.tsx",
  "web/src/components/native-navigation-tree.test.tsx"
]
reason = "The loader's scoped lists cannot recover rows already narrowed away, so optional allWorkspaces and allTabs preserve the lead's merged rows for the hierarchy while existing consumers and solo fallbacks remain unchanged. The same single-owner path also carries optional fleetVersions: one read of the shared crew census (`fetchCrew`, `/api/crew` since Collie 1.8; the previous path's redirect is gone since Collie 1.9) starts beside the required snapshot, never delays navigation, and yields both the lead's own runtime version — the reference every member is compared against — and each member's report from the same answer. No other source is read and no request leaves the lead for it. Host rows consume that cached view without requests or timers. The census read, its cached view and the `FleetVersionView` type it fills live in the fork-owned web/src/lib/fleet-version-view.ts — it calls no Collie updater, adds no crew field and gives the browser no installation authority — so the loader gains one import, one call beside the snapshot and the optional field, and neither Collie's types file nor its loader suite carries any of it: the case that the census never holds the first snapshot lives in web/src/lib/fleet-version-loader.test.ts."

[[invasive]]
id = "repository-guidance"
intent = "Keep canonical downstream guidance and local configuration exclusions explicit."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.19.0"
paths = [
  ".gitignore#/fleet.toml",
  "AGENTS.md#Repository-specific OpenSpec and Git Workflow Requirements",
  "CLAUDE.md#AGENTS.md"
]
verify = ["AGENTS.md", ".gitignore", "fleet/terminal/session.test.ts", "fleet/terminal/connection.test.ts", "fleet/terminal/spawn.test.ts"]
reason = "Repository entrypoints and ignore rules are upstream-owned surfaces that every contributor consumes. Since the Collie 1.18.0 adoption the working agreement also states that Fleet's strings go through `ft()` and never into Collie's dictionaries, and that always-on pairing behind the Gateway is the Gateway's own device. This entry also carries the fork's recorded ADR 0008 departure: .adr/ is Collie's and is never written to, so the working agreement states the short downstream rule while the owning change's design explains it. The Pane's second surface uses terminal attach with automatic external-attachment takeover on lead and peer; it keeps one shared establishment and refuses another Fleet browser rather than displacing it. The mirror the ADR is about remains unchanged. The working agreement is the required normative entrypoint, so an owned document alone cannot replace this edit. Since Collie 1.8 upstream makes CLAUDE.md the canonical file and AGENTS.md a pointer to it; this fork keeps the reverse — AGENTS.md canonical and CLAUDE.md the relative symlink — and never reads upstream's CLAUDE.md into the link. The lint rule states the fork's one exception to upstream's no-suppression policy (reduce-fork-footprint): a fork-owned parse boundary of ADR 0019's class suppresses `no-runtime-typeof` at the line, so `.oxlintrc.json` stays upstream's text; and the Fleet manual it links is fleet/README.md."

[[invasive]]
id = "fake-network-fleet-routes"
intent = "Teach the shared MSW handlers about Fleet's own authenticated route."
strategy = "adapt"
review = "every-upstream-sync"
reviewed = "v1.19.0"
paths = ["web/src/test/handlers.ts#Default happy-path handlers"]
verify = ["web/src/routes/settings.test.tsx", "web/src/playground/app.test.tsx"]
reason = "The app has an authenticated endpoint Collie does not, and the shared fake network is where every suite learns what the network answers. Settings returns 404 — exactly what a Collie with no Fleet Gateway in front of it answers — so Collie's own suites keep rendering Settings unchanged and the fork's editor simply does not appear. Without it the route's one fetch never settles under MSW and Settings playground renders may never settle. Version evidence needs no handler of its own: it rides the census, whose default solo-world 404 is upstream's. Manual Pane fit's availability read (`/fleet/api/pane-fit`) answers the same 404, so Collie's own Pane-page suites draw no Resize row, exactly as a Collie with no Gateway would. Collie 1.19's New page reads `/api/launchers` from upstream's own handlers; the Fleet route needs nothing new for it."

