reason = "Upstream is developed against example data; this fork is developed against its operator's own production environment, so a real address or a real path is one paste away from a fixture. The hook is where the other three guards already live and the only place a check runs whether or not anyone remembered, so guard D is appended after them in upstream's own shape: one SKIP_ variable, one else-branch, one message naming the hatch. The one upstream line that had to move is the lint guard's skip branch, which exited the hook outright — harmless while lint was last, and a silent disarm of anything after it; it now empties the file set instead, so each hatch skips exactly its own guard. Nothing upstream checks changes, and removing this block restores the file byte-for-byte."

