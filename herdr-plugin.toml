id = "memset0.herdr-fleet"
name = "Herdr Fleet"
version = "3.1.1"
min_herdr_version = "0.7.0"
description = "Authenticated mobile web UI for the AI agents in your Herdr fleet"
platforms = ["linux", "macos"]

# Herdr Fleet owns one generation-qualified supervisor. The shell entrypoint only locates Bun,
# bootstraps Collie's existing build when necessary, and delegates to fleet/control.ts.
[[build]]
command = ["bash", "scripts/herdr-fleet.sh", "build"]
platforms = ["linux", "macos"]

[[actions]]
id = "start"
title = "Start Herdr Fleet"
contexts = ["workspace"]
command = ["bash", "scripts/herdr-fleet.sh", "start"]

[[actions]]
id = "stop"
title = "Stop Herdr Fleet"
contexts = ["workspace"]
command = ["bash", "scripts/herdr-fleet.sh", "stop"]

[[actions]]
id = "restart"
title = "Restart Herdr Fleet"
contexts = ["workspace"]
command = ["bash", "scripts/herdr-fleet.sh", "restart"]

[[actions]]
id = "status"
title = "Herdr Fleet status"
contexts = ["workspace"]
command = ["bash", "scripts/herdr-fleet.sh", "status"]

[[actions]]
id = "url"
title = "Show Herdr Fleet URL"
contexts = ["workspace"]
command = ["bash", "scripts/herdr-fleet.sh", "url"]

[[actions]]
id = "push-keys"
title = "Generate push keys"
contexts = ["workspace"]
command = ["bash", "scripts/collie-ctl.sh", "push-keys"]

[[actions]]
id = "push-test"
title = "Send a test notification"
contexts = ["workspace"]
command = ["bash", "scripts/collie-ctl.sh", "push-test"]
