id = "memset0.web-remote"
name = "Web Remote"
version = "1.0.0"
min_herdr_version = "0.8.0"
description = "Authenticated Fleet dashboard and Collie-based remote UI for Herdr"
platforms = ["linux", "macos"]

[[build]]
command = ["bash", "scripts/build.sh"]
platforms = ["linux", "macos"]

[[startup]]
command = ["bash", "scripts/web-remote.sh", "ensure"]

[[actions]]
id = "ensure"
title = "Ensure Web Remote is running"
description = "Converge on one current plugin-owned supervisor"
contexts = ["global"]
command = ["bash", "scripts/web-remote.sh", "ensure"]

[[actions]]
id = "status"
title = "Show Web Remote status"
contexts = ["global"]
command = ["bash", "scripts/web-remote.sh", "status"]

[[actions]]
id = "restart"
title = "Restart Web Remote children"
contexts = ["global"]
command = ["bash", "scripts/web-remote.sh", "restart"]

[[actions]]
id = "stop"
title = "Stop Web Remote"
contexts = ["global"]
command = ["bash", "scripts/web-remote.sh", "stop"]

[[events]]
on = "pane.agent_detected"
command = ["bash", "scripts/web-remote.sh", "ensure"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "scripts/web-remote.sh", "ensure"]

[[events]]
on = "pane.closed"
command = ["bash", "scripts/web-remote.sh", "ensure"]

[[events]]
on = "pane.focused"
command = ["bash", "scripts/web-remote.sh", "ensure"]

[[events]]
on = "pane.moved"
command = ["bash", "scripts/web-remote.sh", "ensure"]

[[events]]
on = "tab.focused"
command = ["bash", "scripts/web-remote.sh", "ensure"]

[[events]]
on = "tab.renamed"
command = ["bash", "scripts/web-remote.sh", "ensure"]

[[events]]
on = "workspace.focused"
command = ["bash", "scripts/web-remote.sh", "ensure"]

[[events]]
on = "workspace.renamed"
command = ["bash", "scripts/web-remote.sh", "ensure"]
