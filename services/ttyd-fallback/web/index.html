<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Herdr emergency terminal</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: #111018; color: #e8e2f2; }
    main { min-height: 100vh; display: grid; place-items: center; }
    .compact-note { width: min(38rem, calc(100% - 2rem)); border: 1px solid #494252; border-radius: 14px; padding: 2rem; background: #1a1721; color: #bdb5c8; line-height: 1.6; }
    iframe { display: none; width: 100%; height: 100vh; border: 0; background: #111018; }
    @media (min-width: 1024px) and (hover: hover) and (pointer: fine) {
      main { display: block; }
      iframe { display: block; }
      .compact-note { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <iframe title="Herdr emergency terminal" referrerpolicy="no-referrer"></iframe>
    <p class="compact-note">The emergency terminal is available only in the desktop-computer presentation.</p>
  </main>
  <script>
    (() => {
      const desktop = matchMedia("(min-width: 1024px) and (hover: hover) and (pointer: fine)");
      const terminal = document.querySelector("iframe");
      let timer = null;
      const heartbeat = () => {
        if (document.visibilityState !== "visible" || !desktop.matches) return;
        fetch("heartbeat", { method: "POST", credentials: "same-origin", cache: "no-store" })
          .catch(() => {});
      };
      const reconcile = () => {
        const visible = document.visibilityState === "visible" && desktop.matches;
        if (visible && !terminal.getAttribute("src")) terminal.setAttribute("src", "terminal/");
        if (!visible && timer !== null) {
          clearInterval(timer);
          timer = null;
        } else if (visible && timer === null) {
          heartbeat();
          timer = setInterval(heartbeat, 60_000);
        }
      };
      document.addEventListener("visibilitychange", reconcile);
      desktop.addEventListener("change", reconcile);
      reconcile();
    })();
  </script>
</body>
</html>
